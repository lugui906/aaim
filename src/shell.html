<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Aaim Agent · 单文件 AI Agent</title>
<meta name="description" content="单文件 HTML AI Agent：多提供商 LLM 接入、ReAct 工具循环、联网搜索、Word/Excel/PPT/PDF 生成、图表与沙箱演示、本地知识库。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234d6bfe'/%3E%3Cpath d='M20 44V22h6l6 10 6-10h6v22h-5V31l-5 8h-4l-5-8v13z' fill='%23fff'/%3E%3C/svg%3E">
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div class="brandtxt"><b>Aaim Agent</b><small>单文件 · 无后端</small></div>
      <button id="btnNavClose" class="iconbtn navclose" title="关闭会话列表" aria-label="关闭侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="side-actions">
      <button id="btnNew" class="btn block"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新会话</span></button>
    </div>
    <div id="sessions"></div>
    <div class="side-foot">
      <span class="pill" id="queueBadge" style="display:none"></span>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button id="btnMenu" class="iconbtn" title="会话列表" aria-label="打开会话列表" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="title" id="topTitle">新会话</div>
      <div class="sp"></div>
      <button id="btnTheme" class="iconbtn" title="切换浅色 / 深色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg></button>
      <div class="menu-wrap">
        <button id="btnMore" class="iconbtn" title="更多"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        <div class="menu" id="moreMenu">
          <button data-m="memory">长期记忆<em id="memCount"></em></button>
          <button data-m="spec">功能规格对照</button>
          <button data-m="usage">用量与预算<em id="usageInline"></em></button>
          <button data-m="export">导出 / 分享</button>
          <button data-m="import">导入配置</button>
          <button data-m="clear" class="danger">清空当前会话</button>
        </div>
      </div>
      <button id="btnSettings" class="iconbtn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3.6h.1A1.7 1.7 0 0 0 10 2.1V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>

    <div id="stream">
      <div class="wrap" id="messages"></div>
    </div>

    <div id="composer">
      <div class="box">
        <div id="attachBox" class="attach" style="display:none"></div>
        <textarea id="prompt" rows="1" placeholder="给 Agent 一个任务…"></textarea>
        <div class="crow">
          <button id="btnLocal" class="iconbtn" title="打开本机文件（可直接修改）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h7A1.5 1.5 0 0 1 19 9.7v8.8A1.5 1.5 0 0 1 17.5 20h-13A1.5 1.5 0 0 1 3 18.5z"/></svg></button>
          <button id="btnAttach" class="iconbtn" title="添加附件（图片 / PDF / 文本）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="btnMic" class="iconbtn" title="语音输入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V21"/></svg></button>
          <div class="sp"></div>
          <button id="btnSend" title="发送（Enter）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </button>
          <button id="btnStop" style="display:none" title="停止（Esc）"><span></span></button>
        </div>
      </div>
      <div class="hint">
        <span><span class="kbd">Enter</span> 发送</span>
        <span><span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</span>
        <span><span class="kbd">Esc</span> 停止</span>
        <span>拖入文件直接解析</span>
        <span>数据仅存本机</span>
      </div>
    </div>

    <div id="drawer">
      <div class="dh"><b>设置</b><button id="drawerClose" class="iconbtn" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="tabs" id="drawerTabs"></div>
      <div class="db" id="drawerBody"></div>
    </div>

    <div class="dropmark">松开以添加文件</div>
  </main>

  <!-- 移动端侧栏遮罩：必须放在 #app 内，才能与 #sidebar 共用同一层叠上下文 -->
  <div id="navMask"></div>
</div>

<div id="modal"></div>
<div id="toasts"></div>
<input type="file" id="fileInput" multiple accept="image/*,.pdf,.docx,.xlsx,.pptx,.xls,.csv,.txt,.md,.markdown,.json,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log" style="display:none">
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<input type="file" id="kbFile" multiple accept=".pdf,.docx,.xlsx,.pptx,.xls,.csv,.txt,.md,.markdown,.json" style="display:none">
<script>/*__JS__*/</script>
</body>
</html>
