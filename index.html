/* ---------------- 本地知识库（G5/G6/G7） ---------------- */
const KB = {
  docs() { return State.kb.docs; },
  chunkText(text, size = 480, overlap = 80) {
    const clean = String(text).replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();
    const paras = clean.split(/\n\n+/);
    const chunks = [];
    let buf = '';
    for (const p of paras) {
      if ((buf + '\n\n' + p).length > size && buf) {
        chunks.push(buf.trim());
        buf = buf.slice(Math.max(0, buf.length - overlap)) + '\n\n' + p;
      } else buf = buf ? buf + '\n\n' + p : p;
    }
    if (buf.trim()) chunks.push(buf.trim());
    return chunks.filter((c) => c.length > 20).slice(0, 400);
  },
  addDoc(name, text) {
    const docId = uid('doc');
    const chunks = this.chunkText(text);
    const doc = { id: docId, name, chars: String(text).length, chunks: chunks.length, ts: Date.now(), text: String(text).slice(0, 20000) };
    State.kb.docs.unshift(doc);
    chunks.forEach((t, i) => State.kb.chunks.push({ id: uid('ch'), docId, docName: name, idx: i, text: t, vec: null }));
    State.kb.chunks = State.kb.chunks.slice(-3000);
    Store.set('kb', State.kb);
    return doc;
  },
  removeDoc(docId) {
    State.kb.docs = State.kb.docs.filter((d) => d.id !== docId);
    State.kb.chunks = State.kb.chunks.filter((c) => c.docId !== docId);
    Store.set('kb', State.kb);
  },
  clear() { State.kb = { docs: [], chunks: [] }; Store.set('kb', State.kb); },
  tokenize(s) {
    const t = String(s).toLowerCase();
    const words = (t.match(/[a-z0-9_]+/g) || []);
    const cjk = (t.match(/[\u4e00-\u9fff]/g) || []);
    const bi = [];
    for (let i = 0; i < cjk.length - 1; i++) bi.push(cjk[i] + cjk[i + 1]);
    return words.concat(cjk, bi);
  },
  async search(query, topK = 5) {
    const chunks = State.kb.chunks;
    if (!chunks.length) return [];
    const qTerms = this.tokenize(query);
    if (!qTerms.length) return [];
    const df = new Map();
    const chunkTf = chunks.map((c) => {
      const toks = this.tokenize(c.text);
      const tf = new Map();
      for (const t of toks) tf.set(t, (tf.get(t) || 0) + 1);
      for (const t of new Set(toks)) df.set(t, (df.get(t) || 0) + 1);
      return tf;
    });
    const N = chunks.length, avgdl = chunks.reduce((a, c) => a + c.text.length, 0) / N;
    const k1 = 1.4, b = 0.72;
    const scored = chunks.map((c, i) => {
      const tf = chunkTf[i];
      let s = 0;
      for (const q of qTerms) {
        const f = tf.get(q) || 0; if (!f) continue;
        const n = df.get(q) || 1;
        const idf = Math.log(1 + (N - n + 0.5) / (n + 0.5));
        s += idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * (c.text.length / avgdl)));
      }
      return { ...c, score: s };
    }).filter((x) => x.score > 0).sort((a, b2) => b2.score - a.score);
    let hits = scored.slice(0, topK);
    // 可选向量检索融合（G6）
    if (State.settings.kb.embedProvider !== 'none' && State.kb.chunks.some((c) => c.vec)) {
      try {
        const qv = await this.embed([query]);
        if (qv && qv[0]) {
          const cos = (a, bv) => { let d = 0, na = 0, nb = 0; for (let i = 0; i < a.length; i++) { d += a[i] * bv[i]; na += a[i] * a[i]; nb += bv[i] * bv[i]; } return d / (Math.sqrt(na) * Math.sqrt(nb) || 1); };
          const vecHits = State.kb.chunks.filter((c) => c.vec).map((c) => ({ ...c, score: cos(qv[0], c.vec) * 3 })).sort((a, b2) => b2.score - a.score).slice(0, topK);
          const seen = new Set(hits.map((h) => h.id));
          for (const v of vecHits) if (!seen.has(v.id)) hits.push(v);
          hits = hits.slice(0, topK);
        }
      } catch { }
    }
    return hits;
  },
  async embed(texts) {
    const cfg = State.settings.kb;
    if (cfg.embedProvider === 'none') return null;
    let url, key, model = cfg.embedModel;
    if (cfg.embedProvider === 'openai') { url = (State.settings.providers.openai.baseUrl || 'https://api.openai.com/v1').replace(/\/+$/, '') + '/embeddings'; key = cfg.embedKey || State.settings.providers.openai.apiKey; }
    else if (cfg.embedProvider === 'qwen') { url = 'https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings'; key = cfg.embedKey || State.settings.providers.qwen.apiKey; if (!cfg.embedKey) model = 'text-embedding-v3'; }
    else if (cfg.embedProvider === 'custom') { url = applyProxy(cfg.embedKey ? cfg.embedKey : ''); key = ''; }
    if (!url) throw new Error('嵌入接口未配置');
    const r = await fetch(applyProxy(url), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key }, body: JSON.stringify({ model, input: texts }) });
    if (!r.ok) throw new Error('嵌入 HTTP ' + r.status);
    const j = await r.json();
    return (j.data || []).map((d) => d.embedding);
  },
  async indexEmbeddings(onProgress) {
    const cfg = State.settings;
    const todo = State.kb.chunks.filter((c) => !c.vec);
    const batch = 16;
    for (let i = 0; i < todo.length; i += batch) {
      const part = todo.slice(i, i + batch);
      try {
        const vs = await this.embed(part.map((p) => p.text));
        if (!vs) throw new Error('无返回');
        part.forEach((p, k) => { p.vec = vs[k]; });
        onProgress && onProgress(Math.min(1, (i + batch) / todo.length));
      } catch (e) { throw new Error('向量化失败：' + e.message); }
      await sleep(120);
    }
    Store.set('kb', State.kb);
    return State.kb.chunks.filter((c) => c.vec).length;
  }
};

/* ===== 06-agent.js ===== */
/* ============ 06 Agent 循环：ReAct / 队列 / 裁剪 / 预算 / 确认 ============ */
const Agent = {
  busy: false,
  stopFlag: false,
  hooks: {},            // UI 注入：onStep / onDelta / onThink / onTool / onDone / onError / onUsage
  queue: [],

  /* ---- 上下文裁剪（A1） ---- */
  trim(messages, limit, keepRecent) {
    const sys = messages.filter((m) => m.role === 'system');
    const rest = messages.filter((m) => m.role !== 'system');
    if (estMessagesTokens(messages) <= limit) return messages;
    const turns = []; let cur = [];
    for (const m of rest) {
      if (m.role === 'user' && cur.length) { turns.push(cur); cur = []; }
      cur.push(m);
    }
    if (cur.length) turns.push(cur);
    const picked = []; let tok = estMessagesTokens(sys);
    for (let i = turns.length - 1; i >= 0; i--) {
      const t = turns[i];
      const tt = estMessagesTokens(t);
      const isRecent = picked.length < Math.ceil(keepRecent / 2);
      if (!isRecent && tok + tt > limit) break;
      picked.unshift(t);
      tok += tt;
    }
    const flat = picked.flat();
    const dropped = rest.length - flat.length;
    if (dropped > 0 && sys.length) sys[0] = Object.assign({}, sys[0], { content: sys[0].content + `\n\n（提示：为保证上下文长度，已裁剪较早的 ${dropped} 条消息。）` });
    return sys.concat(flat);
  },

  /* ---- 预算护栏（L3）
     作用域要分清：
       · 工具调用次数 = 每轮上限（防止单轮死循环）
       · token / 费用 = 每个会话累计（防止一轮对话花太多）
     这些都必须可重置，否则攒满后每一轮都会立刻失败，表现为「输出无故停止」。 */
  turnTools: 0,
  spendOf() {
    const s = State.current();
    if (!s.spend) s.spend = { tok: 0, cost: 0 };
    return s.spend;
  },
  budgetExceeded() {
    const b = State.settings.budget || {};
    const maxTools = Number(b.maxToolCalls) || 40;
    const maxTok = Number(b.maxTokens) || 200000;
    const maxCost = Number(b.maxCost);
    const sp = this.spendOf();
    if (this.turnTools >= maxTools) {
      return { kind: 'tools', msg: `本轮工具调用已达 ${maxTools} 次上限（防死循环）`, reset: false };
    }
    if (!b.unlimited && sp.tok >= maxTok) {
      return { kind: 'tokens', msg: `本会话已用 ${sp.tok} token，达到上限 ${maxTok}`, reset: true };
    }
    if (!b.unlimited && isFinite(maxCost) && maxCost > 0 && sp.cost >= maxCost) {
      return { kind: 'cost', msg: `本会话估算费用 ¥${sp.cost.toFixed(3)}，达到上限 ¥${maxCost}`, reset: true };
    }
    return null;
  },
  /** 清零本会话消耗；工具次数是每轮自动清零的 */
  resetBudget() {
    const s = State.current();
    s.spend = { tok: 0, cost: 0 };
    this.turnTools = 0;
    State.saveSessions();
  },

  /* ---- 入队（E1：串行） ---- */
  enqueue(text, opts = {}) {
    this.queue.push({ text, opts });
    if (!this.busy) this.drain();
    else this.hooks.onQueue && this.hooks.onQueue(this.queue.length);
  },
  async drain() {
    if (this.busy) return;
    this.busy = true;
    try {
      while (this.queue.length) {
        const job = this.queue.shift();
        this.hooks.onQueue && this.hooks.onQueue(this.queue.length);
        await this.runTurn(job.text, job.opts);
      }
    } finally {
      this.busy = false;
      this.hooks.onIdle && this.hooks.onIdle();
    }
  },
  stop() { this.stopFlag = true; if (State.abort) State.abort.abort(); },

  /* ---- 单轮 ReAct ---- */
  async runTurn(userText, opts = {}) {
    const session = State.current();
    const s = State.settings;
    this.stopFlag = false;
    this.turnTools = 0;          // 每轮重置，只用于防单轮死循环
    const turnStart = performance.now();
    // 用户消息
    // 把沙箱里积攒的交互事件压缩成一小段附言带给模型（不塞进消息列表，也不显示在界面）
    let sandboxNote = '';
    const logs = Array.isArray(session.sandboxLog) ? session.sandboxLog.filter((x) => !x.consumed) : [];
    if (logs.length) {
      sandboxNote = '\n\n【沙箱交互事件】\n' + logs.slice(-10).map((x) => {
        const c = x.count > 1 ? ` ×${x.count}` : '';
        return `- ${x.name}${c}: ${truncate(JSON.stringify(x.payload), 120)}`;
      }).join('\n');
      logs.forEach((x) => { x.consumed = true; });
      session.sandboxLog = session.sandboxLog.slice(-20);
    }
    const userMsg = {
      role: 'user', content: userText + sandboxNote,
      display: opts.display != null ? opts.display : null,   // 界面上只显示这句，不显示附件全文
      images: opts.images || [], ts: Date.now(), files: opts.files || []
    };
    session.messages.push(userMsg);
    session.updatedAt = Date.now();
    if (session.messages.filter((m) => m.role === 'user').length === 1) {
      const titleSrc = (opts.display && String(opts.display).trim()) || userText;
      session.title = truncate(String(titleSrc).replace(/\n/g, ' '), 24) || '新会话';
    }
    State.saveSessions();
    this.hooks.onUser && this.hooks.onUser(userMsg);
    this.hooks.onStepsStart && this.hooks.onStepsStart();

    let step = 0, finalText = '';
    const maxSteps = clamp(Number(s.maxSteps) || 8, 1, 24);
    try {
      while (step < maxSteps) {
        step++;
        const over = this.budgetExceeded();
        if (over) {
          const e = new Error(over.msg);
          e.budget = over;       // 让 onError 渲染「继续（重置预算）」而不是直接死掉
          throw e;
        }
        if (this.stopFlag) break;
        const ctx = this.trim([{ role: 'system', content: buildSystemPrompt() }, ...session.messages.filter((m) => m.role !== 'system')], Number(s.contextLimit) || 24000, Number(s.keepRecent) || 6);
        State.abort = new AbortController();
        this.hooks.onStepStart && this.hooks.onStepStart(step);
        let res;
        try {
          res = await LLM.chat({
            messages: ctx,
            tools: Tools.schemas(),
            signal: State.abort.signal,
            session,
            onDelta: (d, all) => { finalText = all; this.hooks.onDelta && this.hooks.onDelta(d, all, step); },
            onThink: (d, all) => { this.hooks.onThink && this.hooks.onThink(d, all, step); }
          });
        } catch (e) {
          if (e.name === 'AbortError' || this.stopFlag) { this.hooks.onAborted && this.hooks.onAborted(); return; }
          throw e;
        }
        // 统计
        const inTok = res.usage.in || estMessagesTokens(ctx);
        const outTok = res.usage.out || estTokens(res.text || '');
        const b = s.budget;
        const cost = (inTok / 1e6) * Number(b.priceIn || 0) + (outTok / 1e6) * Number(b.priceOut || 0);
        State.usage.inTok += inTok; State.usage.outTok += outTok; State.usage.calls++; State.usage.cost += cost;
        { const sp = this.spendOf(); sp.tok += inTok + outTok; sp.cost += cost; }
        session.usage = session.usage || { inTok: 0, outTok: 0, calls: 0, toolCalls: 0, cost: 0 };
        session.usage.inTok += inTok; session.usage.outTok += outTok; session.usage.calls++; session.usage.cost += cost;
        this.hooks.onUsage && this.hooks.onUsage({ inTok, outTok, calls: 1, cost, step });

        const asst = {
          role: 'assistant', content: res.text || '',
          tool_calls: (res.toolCalls || []).map((t) => ({ id: t.id, name: t.name, arguments: t.arguments })),
          thinking: res.thinking || '', ts: Date.now(), step
        };
        session.messages.push(asst);
        this.hooks.onAssistantDone && this.hooks.onAssistantDone(asst, step);
        if (!asst.tool_calls.length) { finalText = res.text; break; }

        // 串行执行工具
        for (const call of asst.tool_calls) {
          if (this.stopFlag) break;
          const tool = Tools.get(call.name);
          const needConfirm = s.toolConfirm && tool && (tool.sensitive || s.confirmAll);
          let out;
          if (needConfirm) {
            const approved = await confirmDialog(
              '工具调用确认：' + call.name,
              `<div>模型请求执行一个${tool.sensitive ? ' <b style="color:#f59e0b">敏感</b> ' : ''}工具：</div>
               <div style="margin:6px 0"><code>${esc(call.name)}</code> — ${esc(tool.desc || '')}</div>
               <pre>${esc(JSON.stringify(call.arguments, null, 2)).slice(0, 3000)}</pre>
               <div style="font-size:12px;color:#94a8c6">可在 设置 → 安全 里关闭确认（不推荐）。</div>`,
              '允许执行'
            );
            if (!approved) out = { ok: false, summary: '用户拒绝了这次工具调用', display: { kind: 'denied', name: call.name } };
          }
          if (!out) {
            this.hooks.onToolStart && this.hooks.onToolStart(call);
            out = await Tools.exec(call.name, call.arguments, { session });
          }
          this.turnTools++;
          session.usage.toolCalls = (session.usage.toolCalls || 0) + 1;
          const toolMsg = { role: 'tool', tool_call_id: call.id, name: call.name, content: Tools.toToolText(out), ts: Date.now(), display: out.display, ok: out.ok };
          session.messages.push(toolMsg);
          this.hooks.onToolEnd && this.hooks.onToolEnd(call, out, step);
          this.hooks.onUsage && this.hooks.onUsage({ toolCalls: 1 });
          State.saveSessions();
        }
        if (this.stopFlag) break;
      }
      if (step >= maxSteps && !this.stopFlag) {
        this.hooks.onWarn && this.hooks.onWarn(`已达到最大步数 ${maxSteps}，Agent 主动停止。可在设置里调高「最大步数」。`);
      }
      this.hooks.onDone && this.hooks.onDone(finalText, Math.round(performance.now() - turnStart));
      // 自动朗读（F1）
      if (s.tts.enabled) TTS.speak(finalText);
    } catch (e) {
      if (e.name === 'AbortError') { this.hooks.onAborted && this.hooks.onAborted(); }
      else this.hooks.onError && this.hooks.onError(e);
    } finally {
      State.abort = null;
      session.updatedAt = Date.now();
      State.saveSessions();
    }
  },

  /* ---- 重新生成最后一轮 ---- */
  async regenerate() {
    const session = State.current();
    const idx = session.messages.map((m) => m.role).lastIndexOf('user');
    if (idx < 0) return toast('没有可重新生成的消息', 'err');
    const userMsg = session.messages[idx];
    session.messages = session.messages.slice(0, idx);
    State.saveSessions();
    UI.renderMessages();
    this.enqueue(userMsg.content, { images: userMsg.images || [], display: userMsg.display, files: userMsg.files });
  }
};

/* ---------------- 多 Agent 协作：delegate_task（A8） ---------------- */
Tools.register({
  name: 'delegate_task', category: 'agent', sensitive: false,
  desc: '把一个可以独立完成的子任务委派给子 Agent（上下文隔离，只给只读工具：搜索/抓取/计算）。返回子 Agent 的结论摘要。适合并行不了但需要独立调查的子问题。',
  params: {
    type: 'object',
    properties: {
      task: { type: 'string', description: '子任务描述，要自包含（子 Agent 看不到当前对话）' },
      max_steps: { type: 'integer', description: '子 Agent 最大步数，默认 3' }
    },
    required: ['task']
  },
  async run(args, ctx) {
    const allowed = ['web_search', 'web_fetch', 'run_js', 'kb_search', 'render_chart'];
    const subTools = Tools.schemas().filter((t) => allowed.includes(t.function.name));
    const msgs = [
      { role: 'system', content: '你是子 Agent。只做被指派的子任务，尽量少调用工具，最后用 200 字内中文给出结论与来源链接。' },
      { role: 'user', content: String(args.task || '') }
    ];
    const maxSteps = clamp(Number(args.max_steps) || 3, 1, 6);
    const trace = [];
    for (let i = 0; i < maxSteps; i++) {
      if (Agent.stopFlag) break;
      const res = await LLM.chat({ messages: msgs, tools: subTools, signal: State.abort ? State.abort.signal : undefined });
      State.usage.inTok += res.usage.in || 0; State.usage.outTok += res.usage.out || 0;
      if (!res.toolCalls.length) {
        trace.push({ text: res.text });
        return { ok: true, summary: `子 Agent 完成：\n${res.text}`, data: { steps: trace, answer: res.text }, display: { kind: 'delegate', task: args.task, answer: res.text, trace } };
      }
      msgs.push({ role: 'assistant', content: res.text || '', tool_calls: res.toolCalls });
      for (const c of res.toolCalls) {
        const out = await Tools.exec(c.name, c.arguments, ctx);
        trace.push({ tool: c.name, summary: truncate(out.summary, 160) });
        msgs.push({ role: 'tool', tool_call_id: c.id, name: c.name, content: Tools.toToolText(out, 3000) });
      }
    }
    const last = trace.filter((t) => t.text).pop();
    return { ok: true, summary: '子 Agent 达到步数上限，已收集：\n' + (last ? last.text : JSON.stringify(trace).slice(0, 800)), display: { kind: 'delegate', task: args.task, answer: last ? last.text : '(未完成)', trace } };
  }
});

/* ---------------- 语音播报（F1） ---------------- */
const TTS = {
  speaking: false,
  voices: [],
  load() {
    if (!('speechSynthesis' in window)) return [];
    this.voices = speechSynthesis.getVoices();
    return this.voices;
  },
  split(text, max = 280) {
    const clean = String(text).replace(/```[\s\S]*?```/g, '（代码块略）').replace(/[#*`>|]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1').replace(/\n{2,}/g, '\n');
    const out = [];
    let buf = '';
    for (const seg of clean.split(/(?<=[。！？；.!?;\n])/)) {
      if ((buf + seg).length > max && buf) { out.push(buf); buf = seg; }
      else buf += seg;
    }
    if (buf.trim()) out.push(buf);
    return out.filter((s) => s.trim());
  },
  speak(text, { rate } = {}) {
    if (!('speechSynthesis' in window)) return toast('当前浏览器不支持语音合成', 'err');
    if (!this.voices.length) this.load();
    speechSynthesis.cancel();
    const parts = this.split(text, Number(State.settings.tts.maxChars) || 280);
    if (!parts.length) return;
    this.speaking = true;
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = /[\u4e00-\u9fff]/.test(p) ? 'zh-CN' : 'en-US';
      u.rate = rate || Number(State.settings.tts.rate) || 1;
      const want = State.settings.tts.voice;
      const v = this.voices.find((x) => x.name === want) || this.voices.find((x) => x.lang.startsWith('zh'));
      if (v) u.voice = v;
      if (i === parts.length - 1) u.onend = () => { this.speaking = false; UI.updateTtsBtn && UI.updateTtsBtn(); };
      speechSynthesis.speak(u);
    });
  },
  stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); this.speaking = false; }
};

/* ---------------- 语音输入（E4） ---------------- */
const ASR = {
  rec: null,
  start(onText, onEnd) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast('当前浏览器不支持语音识别（建议 Chrome/Edge）', 'err');
    const r = new SR();
    r.lang = 'zh-CN'; r.interimResults = true; r.continuous = false;
    r.onresult = (e) => {
      let t = '';
      for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
      onText(t, e.results[e.results.length - 1].isFinal);
    };
    r.onerror = (e) => { toast('语音识别错误：' + e.error, 'err'); onEnd && onEnd(); };
    r.onend = () => { onEnd && onEnd(); };
    r.start(); this.rec = r;
  },
  stop() { if (this.rec) { try { this.rec.stop(); } catch { } this.rec = null; } }
};

/* ===== 07-md.js ===== */
/* ============ 07 自包含 Markdown 渲染（不依赖 CDN，先转义再解析） ============ */
const MD = {
  inline(s) {
    let t = esc(s);
    // 行内代码先占位，避免内部被其它规则改写
    const codes = [];
    t = t.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000C' + (codes.length - 1) + '\u0000'; });
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (m, alt, src) => `<img src="${src}" alt="${alt}" loading="lazy">`);
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (m, txt, href) => {
      const safeHref = /^(https?:|mailto:|#|\/|\.\/|data:image\/)/i.test(href) ? href : '#';
      return `<a href="${safeHref}" target="_blank" rel="noopener noreferrer">${txt}</a>`;
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    t = t.replace(/(^|\s)(https?:\/\/[^\s<）)]+)/g, (m, pre, url) => pre + `<a href="${url}" target="_blank" rel="noopener">${truncate(url, 60)}</a>`);
    t = t.replace(/\u0000C(\d+)\u0000/g, (m, i) => '<code>' + codes[Number(i)] + '</code>');
    return t;
  },

  render(src) {
    const text = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    let out = '';
    let i = 0;
    const flushList = () => { };
    while (i < lines.length) {
      const line = lines[i];
      // 代码块
      if (/^\s*```/.test(line)) {
        const lang = (line.match(/^\s*```(\S*)/) || [])[1] || '';
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        const code = esc(buf.join('\n'));
        out += `<pre><code class="lang-${esc(lang || 'txt')}" data-lang="${esc(lang)}">${code}</code></pre>`;
        continue;
      }
      // 表格
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
        const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        out += '<table><thead><tr>' + head.map((h) => `<th>${this.inline(h)}</th>`).join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + head.map((_, k) => `<td>${this.inline(r[k] == null ? '' : r[k])}</td>`).join('') + '</tr>').join('') +
          '</tbody></table>';
        continue;
      }
      // 标题
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out += `<h${h[1].length}>${this.inline(h[2])}</h${h[1].length}>`; i++; continue; }
      // 分隔线
      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { out += '<hr>'; i++; continue; }
      // 引用
      if (/^\s*>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out += `<blockquote>${this.render(buf.join('\n'))}</blockquote>`;
        continue;
      }
      // 列表
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d+[.)]\s+/.test(line);
        const items = [];
        let j = i;
        while (j < lines.length) {
          const m2 = lines[j].match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
          if (m2) { items.push({ indent: (lines[j].match(/^\s*/) || [''])[0].length, text: m2[2] }); j++; }
          else if (/^\s{2,}\S/.test(lines[j]) && items.length) { items[items.length - 1].text += '\n' + lines[j].trim(); j++; }
          else break;
        }
        i = j;
        const base = Math.min(...items.map((x) => x.indent));
        const li = items.map((it) => {
          const task = it.text.match(/^\[( |x|X)\]\s+(.*)$/);
          if (task) return `<li class="task"><input type="checkbox" disabled ${task[1].toLowerCase() === 'x' ? 'checked' : ''}> ${this.inline(task[2])}</li>`;
          const pad = it.indent > base ? ' class="sub"' : '';
          return `<li${pad}>${this.inline(it.text)}</li>`;
        }).join('');
        const tag = ordered ? 'ol' : 'ul';
        out += ordered && /^\s*\[[ xX]\]/.test(items[0].text) ? `<ul class="tasks">${li}</ul>` : `<${tag}>${li}</${tag}>`;
        continue;
      }
      // 空行
      if (!line.trim()) { i++; continue; }
      // 段落
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|\||([-*+]|\d+[.)])\s)/.test(lines[i])) { buf.push(lines[i]); i++; }
      if (buf.length) out += `<p>${this.inline(buf.join('\n')).replace(/\n/g, '<br>')}</p>`;
      else i++;
    }
    return out;
  },

  /** 渲染后做代码高亮（有 hljs 才做，失败静默） */
  highlight(root) {
    if (!window.hljs) return;
    root.querySelectorAll('pre code').forEach((c) => {
      try { window.hljs.highlightElement(c); } catch { }
    });
  },

  /** 从 Markdown 中提取文件链接（tool 生成的下载卡片） */
  extractFileCards(text) {
    const out = [];
    const re = /\[([^\]]+)\]\((blob:|data:)[^)]*\)/g;
    let m;
    while ((m = re.exec(text))) out.push({ name: m[1] });
    return out;
  }
};

/* ===== 08-ui.js ===== */
/* ============ 08 消息渲染 / 步骤面板 / 工具结果卡片 ============ */
const UI = {
  turn: null,           // 当前回合的 DOM 句柄
  _frames: new Map(),   // 沙箱 iframe 缓存（避免重渲染重启）
  _autoRunKey: '',      // 只自动运行最新那一个，其余需用户点击
  _sbx: new Map(),      // 对应的沙箱句柄（可 stop）

  streaming: false,
  lastAssistantText: '',

  init() {
    this.renderSessions();
    this.renderMessages();
    this.updateHeader();
    this.bindSandboxBridge();
  },

  /* ---------------- 会话列表 ---------------- */
  renderSessions() {
    const box = $('#sessions');
    box.innerHTML = '';
    const list = State.sessions.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt);
    if (!list.length) { box.append(el('div', { class: 'sgroup', text: '还没有会话' })); }
    const groups = { '今天': [], '昨天': [], '更早': [] };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (const s of list) {
      const d = new Date(s.updatedAt); d.setHours(0, 0, 0, 0);
      if (d.getTime() >= today.getTime()) groups['今天'].push(s);
      else if (d.getTime() >= today.getTime() - 86400000) groups['昨天'].push(s);
      else groups['更早'].push(s);
    }
    for (const [g, arr] of Object.entries(groups)) {
      if (!arr.length) continue;
      box.append(el('div', { class: 'sgroup', text: g }));
      for (const s of arr) {
        const item = el('div', { class: 'sitem' + (s.id === State.currentId ? ' active' : ''), title: s.title + '\n' + fmtTime(s.updatedAt) },
              el('span', { class: 't', text: s.title || '未命名' }),
          el('span', { class: 'x', html: Icons.close(11), title: '删除会话', onclick: (e) => { e.stopPropagation(); this.deleteSession(s.id); } }));
        item.addEventListener('click', () => {
          State.currentId = s.id; State.saveSessions();
          this.renderSessions(); this.renderMessages(); this.updateHeader();
          if (typeof App !== 'undefined') App.closeNav(false);
        });
        item.addEventListener('dblclick', () => this.renameSession(s));
        box.append(item);
      }
    }
  },
  deleteSession(id) {
    const s = State.sessions.find((x) => x.id === id);
    openModal({
      title: '删除会话', bodyHTML: `<div>确定删除「${esc(s ? s.title : '')}」？此操作不可撤销。</div>`, okText: '删除', okClass: 'danger', onOk: () => {
        State.sessions = State.sessions.filter((x) => x.id !== id);
        if (State.currentId === id) State.currentId = (State.sessions[0] || {}).id || '';
        State.saveSessions(); this.renderSessions(); this.renderMessages(); this.updateHeader();
      }
    });
  },
  renameSession(s) {
    openModal({
      title: '重命名会话', bodyHTML: `<div class="field"><input type="text" id="rnInput" value="${esc(s.title)}"></div>`, okText: '保存',
      onOk: (body) => { const v = body.querySelector('#rnInput').value.trim(); if (v) s.title = v; State.saveSessions(); this.renderSessions(); this.updateHeader(); }
    });
  },
  newSession() {
    const s = newSession('新会话');
    State.sessions.unshift(s); State.currentId = s.id; State.saveSessions();
    this.renderSessions(); this.renderMessages(); this.updateHeader();
    if (typeof App !== 'undefined') App.closeNav(false);
    $('#prompt').focus();
  },

  /** 沙箱子页里的运行时错误：合并提示，避免错误循环刷屏 */
  _sbxErrAt: 0,
  sandboxRunError(msg) {
    const now = Date.now();
    if (now - this._sbxErrAt < 3000) return;
    this._sbxErrAt = now;
    toast('沙箱内脚本报错：' + truncate(String(msg), 80), 'err', 4000);

  /** 顶栏模式 chip：单 Agent / 企业团队 */
  updateModeChip() {

    if (txt) txt.textContent = on ? '企业团队' + (n ? ` · ${n} 人` : '') : '单 Agent';
    chip.classList.toggle('on', on);
    chip.title = on ? '当前：企业式多 Agent 团队（点击切回单 Agent）' : '当前：单 Agent（点击切换到企业团队模式）';
    const oc = $('#orgCount');
    if (oc) oc.textContent = n ? String(n) : '';
  },

  /** 组织变动时刷新徽标与面板 */
  orgChanged() {
    this.updateModeChip();
    const n = (State.org && State.org.nodes) ? State.org.nodes.length : 0;
    const a = $('#orgCount');
    if (a) { a.textContent = n ? String(n) : ''; a.style.display = n ? '' : 'none'; }
    if (typeof OrgUI !== 'undefined') { try { OrgUI.render(); } catch { } }
  },

  updateMemoryBadge() {
    const n = (typeof Memory !== 'undefined') ? Memory.count() : 0;
    const a = $('#memCount');
    if (a) { a.textContent = n ? String(n) : ''; a.style.display = n ? '' : 'none'; }
    const b = $('#usageInline');
    if (b) { const u = State.usage; const t = u.inTok + u.outTok; b.textContent = t ? `${t} tok` : ''; }
  },

  /* ---------------- 顶栏 ---------------- */
  updateHeader() {
    const s = State.current();
    $('#topTitle').textContent = s.title || '新会话';
    const u = State.usage;
    // 侧栏不再显示 tok / 工具数（已并入 ⋯ 菜单的「用量与预算」）
    const b = State.settings.budget, used = (u.inTok + u.outTok) / Math.max(1, b.maxTokens);
    const bar = $('#usageBar i');
    if (bar) bar.style.width = Math.min(100, used * 100) + '%';
  },

  /* ---------------- 消息区 ---------------- */
  renderMessages() {
    const box = $('#messages');
    box.innerHTML = '';
    const s = State.current();
    if (!s.messages.length) { box.append(this.emptyState()); return; }
    const msgs = s.messages;
    let i = 0;
    while (i < msgs.length) {
      const m = msgs[i];
      if (m.role === 'user') { box.append(this.userNode(m)); i++; continue; }
      // 把连续的 assistant / tool 归并为一个回合组
      const group = [];
      while (i < msgs.length && msgs[i].role !== 'user') { group.push(msgs[i]); i++; }
      if (group.length) box.append(this.turnNode(group));
    }
    scrollBottom(true);
  },

  emptyState() {
    const briefs = [
      ['搜一下最新动态', '搜索 2026 年 AI Agent 的主要趋势，给 3 条结论'],
      ['改本机代码', '打开我的 config.json，把 debug 改成 false'],
      ['出个表格', '把 A 12 套 3600、B 8 套 2400、C 5 套 1500 做成 Excel'],
      ['画张图', '画一张 1–5 月销售额与成本的折线图']
    ];
    const fill = (p) => { const ta = $('#prompt'); ta.value = p; autoGrow(ta); ta.focus(); ta.setSelectionRange(p.length, p.length); };
    const on = !!(State.org && State.org.enabled);
    return el('div', { class: 'empty' },
      el('h2', { text: on ? '把目标交给团队' : '今天想做什么？' }),

            onclick: () => { $('#modeChip').click(); },
            title: '领导拆解任务、分派给小领导与执行者，每份产出都要过独立检查者'
          },

          el('span', { class: 'org-cta-tx' },
            el('b', { text: '开启企业模式' }),
            el('span', { text: '多个 Agent 分工协作：大领导拆解 → 小领导分派 → 执行者交付 → 检查者审核' })),
          el('span', { class: 'org-cta-go', text: '→' })),

  userNode(m) {
    if (m.silent) {
      return el('div', { class: 'msg silent' }, el('div', { class: 'body' }, el('span', { text: m.content })));
    }
    const body = el('div', { class: 'body' });

      const g = el('div', { class: 'imgrid' });
      for (const im of m.images) g.append(el('figure', {}, el('img', { src: im.dataUrl, alt: im.name || '' })));
      body.append(g);
    }
    const shown = this.userDisplayText(m);
    if (shown) body.append(el('div', { class: 'bubble', html: MD.render(shown) }));
    // 附件小卡放在气泡下方，紧凑排列，便于看出"带着什么文件在问"
    if (m.files && m.files.length) {
      body.append(el('div', { class: 'attach files' }, m.files.map((f) =>
        el('span', { class: 'a', title: f.name }, 
          el('span', { class: 'artico', html: Icons.file(12) }),

      el('button', { class: 'btn sm ghost', text: '复制', onclick: () => copyText(m.content || '') }),
      el('button', { class: 'btn sm ghost', text: '编辑重发', onclick: () => { $('#prompt').value = this.userDisplayText(m); autoGrow($('#prompt')); $('#prompt').focus(); } })));
    return el('div', { class: 'msg user' }, body);
  },

  /** 用户消息在界面上显示什么：只显示自己写的那句话，不渲染附件全文 */
  userDisplayText(m) {
    if (!m) return '';
    if (m.display != null && String(m.display).trim()) return String(m.display);
    // 兼容旧数据：content 里可能拼了【附件：xxx】全文
    const raw = String(m.content || '');
    const i = raw.indexOf('\n\n【附件：');
    if (i > 0) return raw.slice(0, i).trim();
    if (/^【附件：/.test(raw)) return '（仅附件）';
    return raw;
  },

  /** 一个回合组：折叠的工具摘要 + 可折叠的思考 + 回答 + 产物 */
  turnNode(group) {
    const calls = [];
    for (const m of group) if (m.role === 'assistant' && m.tool_calls) calls.push(...m.tool_calls);
    const tools = group.filter((m) => m.role === 'tool');
    const think = group.filter((m) => m.role === 'assistant' && m.thinking).map((m) => m.thinking).join('\n\n').trim();
    const answer = group.filter((m) => m.role === 'assistant' && m.content).map((m) => m.content).join('\n\n').trim();
    const totalMs = tools.reduce((a, m) => a + (m.ms || 0), 0);
    const failed = tools.filter((m) => m.ok === false).length;
    const arts = this.artifactsOf(group);

    const body = el('div', { class: 'body' });
    const n = Math.max(calls.length, tools.length);

    // 思考过程：可折叠，默认收起
    if (think && State.settings.showThinking) {
      body.append(el('details', { class: 'steps thinkbox' },
        el('summary', {}, el('span', { class: 'stxt', text: `思考过程 · ${think.length} 字` })),
        el('div', { class: 'inner' }, el('div', { class: 'thinking md', html: MD.render(truncate(think, 4000)) }))));
    }

    // 工具调用：一行摘要，默认收起
    if (n > 0) {
      const inner = el('div', { class: 'inner' });
      // 按位置配对「调用」与「结果」；结果多于调用时（历史数据）也要渲染出来
      const maxN = Math.max(calls.length, tools.length);
      for (let i2 = 0; i2 < maxN; i2++) {
        const c = calls[i2] || null;
        const t = tools[i2] || {};
        const name = (c && c.name) || t.name || '工具';
        if (calls.length) {
          inner.append(this.stepNode({ name, args: (c && c.arguments) || {}, state: t.ok === false ? 'err' : 'ok', ms: t.ms }));
        }
        const d = t.display;
        if (d && !this.isDirectDisplay(d)) {
          inner.append(this.withOrgAction(this.displayNode(d, t), name, t.content, d));
        }
      }
      body.append(el('details', { class: 'steps' },
        el('summary', {}, el('span', { class: 'stxt', text: this.stepsLabel(n, totalMs, failed) })), inner));
    }

    // 可视输出（图表/流程图/图片/沙箱）：直接可见
    const vizItems = group.filter((m) => this.isVisualDisplay(m.display));
    if (vizItems.length) {
      const viz = el('div', { class: 'vizout' });
      for (const m of vizItems) {
        // 历史重渲染时，只有被标记为最新且仍存活的那个才继续跑
        if (m.display && m.display.kind === 'frame') {
          const k = m.display._key;
          if (!k || this._autoRunKey !== k) {
            // 临时压制自动运行
          }
        }
        viz.append(this.withOrgAction(this.displayNode(m.display, m), m.name || '工具', m.content, m.display));
      }
      body.append(viz);
    }

    // 产物：始终可见，不用展开
    if (arts.length) body.append(this.artifactsBar(arts));

    if (answer) body.append(el('div', { class: 'bubble md', html: MD.render(answer) }));
    if (answer) body.append(el('div', { class: 'msg-tools' },
      el('button', { class: 'btn sm ghost', html: Icons.copy(13) + '<span>复制</span>', onclick: () => copyText(answer) }),
      el('button', { class: 'btn sm ghost', html: Icons.speaker(13) + '<span>朗读</span>', onclick: () => TTS.speak(answer) }),
      el('button', { class: 'btn sm ghost', html: Icons.retry(13) + '<span>重试</span>', onclick: () => Agent.regenerate() })));
    return el('div', { class: 'msg agent' }, body);
  },

  /** 从一组消息里收集产物（文件类 display） */
  artifactsOf(group) {
    const out = [];
    for (const m of group) {
      const d = m.display;
      if (!d) continue;
      if (d.kind === 'file' && d.art) out.push(d.art);
      else if (d.kind === 'fileframe' && d.art) out.push(d.art);
      else if (d.kind === 'artifacts' && d.items) out.push(...d.items);
    }
    return out;
  },
  /** 文件型产物：显示为可下载卡片，不进折叠区 */
  isArtifactDisplay(d) {
    return d && ((d.kind === 'file' && d.art) || (d.kind === 'fileframe' && d.art) || d.kind === 'artifacts');
  },
  /** 可视输出：图表 / 流程图 / 图片 / 沙箱演示，应当直接可见（用户要看的成果，不是日志） */
  isVisualDisplay(d) {
    return d && ['chart', 'mermaid', 'images', 'frame', 'orgtree', 'orgdeliver', 'orgreview', 'orgmsg'].includes(d.kind);
  },
  /** 既不进折叠区、也不用放进产物条的输出 */
  isDirectDisplay(d) {
    return this.isArtifactDisplay(d) || this.isVisualDisplay(d);
  },

  /** 产物条：常显，可直接下载 */
  artifactsBar(arts) {
    const bar = el('div', { class: 'artifacts' });
    for (const a of arts) {
      bar.append(el('div', { class: 'artfile' },
        el('span', { class: 'artico', html: fileIcon(a.kind, 16) }),
        el('div', { class: 'artmeta' },
          el('span', { class: 'artname', text: a.name, title: a.name }),
          el('span', { class: 'artsize', text: fmtBytes(a.size) })),
        el('button', { class: 'artbtn', title: '下载', html: Icons.download(14), onclick: (e) => this.clickArtifactBtn(e, () => downloadArtifact(a)) }),
        a.mime === MIME.html ? el('button', { class: 'artbtn', title: '在新窗口打开', html: Icons.external(14), onclick: (e) => this.clickArtifactBtn(e, () => openArtifact(a)) }) : null));
    }
    return bar;
  },

  /** 一行摘要文案：「4 个工具调用 · 3.2 秒」 */
  stepsLabel(n, ms, failed) {
    const parts = [`${n} 个工具调用`];
    if (ms) parts.push(fmtMs(ms));
    if (failed) parts.push(`${failed} 个失败`);
    return parts.join(' · ');
  },

  stepNode({ name, args, state = 'running', ms, error }) {
    const rgTxt = { running: '执行中', ok: '成功', err: '失败', denied: '已拒绝' }[state] || state;
    return el('div', { class: 'step' },
      el('div', { class: 'hd' },
        el('span', { class: 'nm', text: name }),
        el('span', { class: 'rg ' + (state === 'running' ? 'running' : state === 'ok' ? 'ok' : 'err'), text: rgTxt + (ms ? ' · ' + fmtMs(ms) : '') }),
        el('span', { style: 'flex:1' }),
        el('button', { class: 'btn sm ghost', text: '参数', onclick: () => openModal({ title: '工具参数 · ' + name, bodyHTML: `<pre>${esc(JSON.stringify(args, null, 2))}</pre>`, hideCancel: true, okText: '关闭' }) })));
  },

  toolNode(m) {
    const node = el('div', { class: 'msg agent' }, el('div', { class: 'av', text: '⚙' }),
      el('div', { class: 'body' }, this.displayNode(m.display, m)));
    return node;
  },

  /* ---------------- 工具结果卡片（D7/K2/K3 等） ---------------- */
  displayNode(d, m) {
    if (!d) return el('div', { class: 'toolcard' }, el('div', { class: 'hd', text: (m && m.name) + ' 已执行' }));
    const kind = d.kind;
    if (kind === 'search') {
      const card = el('div', { class: 'toolcard' },
        el('div', { class: 'hd' }, el('b', { text: '搜索 · ' + d.provider }), el('span', { class: 'badge', text: d.results.length + ' 条' }), el('span', { text: truncate(d.query, 50) })));
      const list = el('div', { class: 'sres' });
      d.results.forEach((r) => {
        list.append(el('div', { class: 'it' },
          el('h4', {}, el('a', { href: r.url, target: '_blank', rel: 'noopener', text: r.title })),
          el('div', { class: 'u', text: truncate(r.url, 90) }),
          el('div', { class: 'sn', text: r.snippet }),
          el('div', { class: 'meta' },
            r.date ? el('span', { text: '🕒 ' + r.date }) : null,
            r.score != null ? el('span', { text: '★ 相关度 ' + Number(r.score).toFixed(3) }) : null,
            r.authority != null ? el('span', { text: '🏛 权威度 ' + r.authority }) : null,
            el('button', { class: 'btn sm ghost', text: '抓全文', onclick: () => this.fetchIntoChat(r.url) }))));
      });
      card.append(list);
      if (d.errs && d.errs.length) card.append(el('div', { class: 'hint', text: '降级记录：' + d.errs.join(' | ') }));
      return card;
    }
    if (kind === 'fetch') {
      return el('div', { class: 'toolcard' },
        el('div', { class: 'hd' }, el('b', { text: '抓取正文' }), el('span', { class: 'badge', text: d.chars + ' 字' }), el('a', { href: d.url, target: '_blank', rel: 'noopener', text: truncate(d.url, 60) })),
        el('div', { style: 'font-size:12px;color:var(--dim)', text: '通道：' + d.via + (d.title ? ' · ' + d.title : '') }));
    }
    if (kind === 'code') {
      return el('div', { class: 'toolcard' },
        el('div', { class: 'hd' }, el('b', { text: '沙箱执行' }), el('span', { class: 'badge', text: d.error ? '报错' : '成功' })),
        el('pre', { style: 'margin:0 0 6px;background:#0a101c;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:200px', text: truncate(d.code, 3000) }),
        d.error ? el('div', { style: 'color:var(--err);font-size:12.5px', text: d.error }) : el('pre', { style: 'margin:0;background:#0a101c;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:220px', text: truncate(d.result, 4000) }));
    }
    if (kind === 'frame' || kind === 'fileframe') {
      const title = d.title || (d.art && d.art.name) || '沙箱预览';
      const card = el('div', { class: 'toolcard' },
        el('div', { class: 'hd' }, el('b', { text: title }), el('span', { class: 'badge', text: 'sandbox' }), el('span', { style: 'flex:1' })));
      if (d.art) card.append(this.artifactNode(d.art));

      // 幻灯片 / 独立 HTML 文件：走 blob 预览
      if (d.previewUrl || d.art) {
        const holder = el('div', { class: 'frame' });
        card.append(holder);
        holder.append(el('div', { class: 'bar' }, el('span', { text: '预览（需联网加载 reveal.js）' })));
        const slot = el('div');
        holder.append(slot);
        setTimeout(async () => {
          let url = d.previewUrl;
          if (!url && d.art) {
            const blob = await resolveArtifactBlob(d.art);
            if (!blob) { slot.append(el('div', { class: 'hint', style: 'padding:16px', text: '预览不可用：内容已不在本地，请重新生成或下载。' })); return; }
            url = URL.createObjectURL(blob);
          }
          slot.append(el('iframe', { sandbox: 'allow-scripts allow-popups', src: url, style: 'height:420px' }));
        }, 0);
        return card;
      }

      /* 内联 HTML 沙箱
         策略：默认不自动执行（避免「重渲染就把所有页面重跑一遍」导致卡死/闪退），
         只有最新生成的那一个自动运行，其余给「运行」按钮让用户点。 */
      const html = String(d.html || '');
      // 只用唯一 id 做 key；没有 id 的历史数据才退回内容签名
      const key = d._uid || d._key || ('f:' + title + ':' + html.length + ':' + (d.height || 220));
      d._key = key;

      const holder = el('div', { class: 'frame' });
      const bar = el('div', { class: 'bar' }, el('span', { text: '沙箱内渲染 · 交互事件会回传给 Agent' }), el('span', { style: 'flex:1' }));
      const stage = el('div');
      holder.append(bar, stage);
      card.append(holder);

      const renderIdle = (msg) => {
        stage.innerHTML = '';
        stage.append(el('div', { class: 'sbxidle' },
          el('span', { text: msg || '预览未运行' }),
          el('button', { class: 'btn sm', text: '运行预览', onclick: () => run() })));
        bar.querySelectorAll('.barstop,.barrun').forEach((b) => b.remove());
        bar.append(el('button', { class: 'barrun', text: '运行', onclick: () => run() }));
      };

      const run = () => {
        // 已有活着的实例就复用（重渲染时不重启）
        let sbx = this._sbx.get(key);
        if (sbx) {
          stage.innerHTML = '';
          stage.append(sbx.iframe);
        } else {
          stage.innerHTML = '';
          sbx = Sandbox.renderHTML(stage, html, { height: d.height || 220, title });
          this._sbx.set(key, sbx);
          this._frames.set(key, sbx.iframe);
          // 缓存上限：超过就销毁最旧的，避免长会话堆积
          if (this._sbx.size > 8) {
            const k0 = this._sbx.keys().next().value;
            const old = this._sbx.get(k0);

        body = `抓取 ${display.url || ''}\n\n${display.text || ''}`;
      } else if (display.kind === 'code') {
        body = `代码：\n${display.code || ''}\n\n结果：\n${display.result || display.error || ''}`;
      } else if (display.kind === 'kb' && display.hits) {
        body = display.hits.map((h, i) => `[${i + 1}] ${h.docName} #${h.idx}\n${h.text}`).join('\n\n');

    if (!body) body = String(text || '');

  async fetchIntoChat(url) {

  bindSandboxBridge() {
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.source === 'aaim-sandbox' || d.__aaimFrame && d.type === 'event') this.sandboxEvent(d);
    });
  },
  /** 沙箱回传的交互事件
     关键：这是高频来源（动画/拖拽类页面每秒可达 60 次）。
     绝不能每条都（1）塞进会话消息（2）同步写 localStorage —— 那会 O(n²) 卡死并最终闪退。 */
  _evt: { map: new Map(), lastSave: 0, saveTimer: null },

  sandboxEvent(d) {
    if (!d || d.type !== 'event') return;
    const now = Date.now();
    const s = State.current();
    if (!Array.isArray(s.sandboxLog)) s.sandboxLog = [];

    const name = String(d.name || 'event').slice(0, 40);

    // 1) 同名事件在 600ms 窗口内合并：只保留一条，累加次数与最新 payload
    const st = this._evt.map.get(name) || { count: 0, lastAt: 0, firstToast: false };
    st.count++;
    const tooSoon = now - st.lastAt < 600;
    st.lastAt = now;
    this._evt.map.set(name, st);

    const open = s.sandboxLog.find((x) => x.name === name);
    if (open) {
      open.count = st.count;
      open.payload = d.payload;
      open.ts = now;
    } else {
      s.sandboxLog.push({ ts: now, name, payload: d.payload, count: st.count });
      // 2) 硬上限：只保留最近 40 条，绝不无界增长
      if (s.sandboxLog.length > 40) s.sandboxLog.shift();
    }

    // 3) 每种事件名只提示一次，且高频事件完全不提示（避免 toast 刷屏占满 DOM）
    if (!st.firstToast && !tooSoon) {
      st.firstToast = true;
      toast(`沙箱回传：${name}`, '', 2000);
    }

    // 4) 审计只记合并后的事件（否则每秒 60 条纯属浪费），并保留上限
    if (!tooSoon) {
      State.audit.push({ ts: now, tool: 'sandbox_event', args: { name, payload: d.payload }, ok: true, ms: 0, summary: name });
      if (State.audit.length > 500) State.audit.splice(0, State.audit.length - 500);
    }

    // 5) 延迟合并写盘，最多每 1.5 秒一次，杜绝每条都全量序列化
    if (!this._evt.saveTimer) {
      this._evt.saveTimer = setTimeout(() => {
        this._evt.saveTimer = null;
        try { State.saveSessions(); } catch { }
      }, 1500);
    }
  }

};

/* ============ 09 应用装配：输入区 / 设置抽屉 / 导入导出 / 启动 ============ */
const App = {
  attachments: [],   // {kind:'image'|'file', name, dataUrl, text, chars}
  listening: false,

  /* ---------------- 输入区 ---------------- */
  initComposer() {
    const ta = $('#prompt');
    ta.addEventListener('input', () => autoGrow(ta));
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && State.settings.sendWithEnter && !e.isComposing) { e.preventDefault(); this.send(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.send(); }
    });
    $('#btnSend').addEventListener('click', () => this.send());
    $('#btnStop').addEventListener('click', () => { Agent.stop(); toast('已请求停止'); });
    $('#btnAttach').addEventListener('click', () => $('#fileInput').click());
    $('#fileInput').addEventListener('change', (e) => { this.addFiles(Array.from(e.target.files || [])); e.target.value = ''; });
    $('#btnMic').addEventListener('click', () => this.toggleMic());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && Agent.busy) { Agent.stop(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); $('#prompt').focus(); }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); UI.newSession(); }
    });
    // 拖拽
    ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { if (ev === 'dragleave' && e.relatedTarget) return; if (ev === 'drop') e.preventDefault(); document.body.classList.remove('dragging'); }));
    document.addEventListener('drop', (e) => { const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []); if (fs.length) this.addFiles(fs); });
  },

  async addFiles(files) {
    const okList = [];
    for (const f of files) {
      if (f.size > 40 * 1024 * 1024) { toast(`${f.name} 超过 40MB，已跳过`, 'err'); continue; }
      const name = f.name;
      try {
        if (/^image\//.test(f.type)) {
          const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
          this.attachments.push({ kind: 'image', name, dataUrl, size: f.size });
        } else if (DocParser.isOffice(name) || /\.pdf$/i.test(name) || f.type === 'application/pdf') {
          // PDF / DOCX / XLSX / PPTX / XLS / CSV → 统一走解析器
          const t = toast(`${name} 解析中…`, '', 60000);
          let r;
          try { r = await DocParser.read(f, name); }
          finally { t.remove(); }
          const text = (r.text || '').slice(0, 200000);
          if (!text.trim()) throw new Error('没有提取到文字内容');
          this.attachments.push({ kind: 'file', name, text, chars: text.length, size: f.size, docKind: r.meta && r.meta.kind, meta: r.meta });
          const label = { docx: 'Word', xlsx: 'Excel', pptx: 'PPT', pdf: 'PDF' }[r.meta && r.meta.kind] || (r.meta && r.meta.kind) || '文本';
          okList.push(`${label}《${name}》${text.length} 字` + (r.meta && r.meta.slides ? ` / ${r.meta.slides} 页` : '') + (r.meta && r.meta.sheets ? ` / ${r.meta.sheets} 表` : ''));
        } else if (/\.(txt|md|markdown|csv|json|js|mjs|ts|tsx|py|html|css|xml|yaml|yml|log|ini|conf|sh|java|c|cpp|h|rs|go|rb|php|sql|toml)$/i.test(name) || /^text\//.test(f.type)) {
          const text = await f.text();
          this.attachments.push({ kind: 'file', name, text: text.slice(0, 200000), chars: text.length, size: f.size, docKind: 'text' });
          okList.push(`《${name}》${text.length} 字`);
        } else {
          const hint = DocParser.unsupportedHint(name);
          toast(hint || `${name}：暂不支持该类型（支持 PDF / Word / Excel / PPT / 文本 / 图片）`, 'err', hint ? 7000 : 4600);
        }
      } catch (e) {
        toast(`${name} 解析失败：${e.message}`, 'err', 7000);
      }
    }
    this.renderAttachments();
    if (okList.length) {
      toast(okList.length === 1 ? '已解析 ' + okList[0] : `已解析 ${okList.length} 个文件`, 'ok', 2000);
    }
  },

  async readPdf(file) { return readPdfBlob(file); },

  renderAttachments() {
    const box = $('#attachBox');
    box.innerHTML = '';
    box.style.display = this.attachments.length ? 'flex' : 'none';
    this.attachments.forEach((a, i) => {
      const node = el('span', { class: 'a' },
        a.kind === 'image' ? el('img', { src: a.dataUrl }) : '📎',
        el('span', { text: a.name + (a.chars ? ` (${a.chars} 字)` : '') }),
        el('span', { class: 'rm', text: '✕', onclick: () => { this.attachments.splice(i, 1); this.renderAttachments(); } }));
      box.append(node);
    });
  },

  toggleMic() {
    if (this.listening) { ASR.stop(); this.listening = false; $('#btnMic').style.color = ''; return; }
    this.listening = true; $('#btnMic').style.color = 'var(--accent)';
    const ta = $('#prompt');
    const base = ta.value;
    ASR.start((t, final) => { ta.value = base + t; autoGrow(ta); if (final) { this.listening = false; $('#btnMic').style.color = ''; } }, () => { this.listening = false; $('#btnMic').style.color = ''; });
  },

  send() {
    const ta = $('#prompt');
    const text = ta.value.trim();
    if (!text && !this.attachments.length) return;
    const images = this.attachments.filter((a) => a.kind === 'image').map((a) => ({ name: a.name, dataUrl: a.dataUrl }));
    const files = this.attachments.filter((a) => a.kind === 'file').map((a) => ({ name: a.name, chars: a.chars }));
    let content = text;
    const fileTexts = this.attachments.filter((a) => a.kind === 'file');
    if (fileTexts.length) {
      content += '\n\n' + fileTexts.map((f) => `【附件：${f.name}】\n${truncate(f.text, 12000)}`).join('\n\n');
    }
    ta.value = ''; autoGrow(ta);
    const display = text || '（仅附件）';
    this.attachments = []; this.renderAttachments();
    // content 含附件全文（给模型），display 只放用户原文（给界面）
    Agent.enqueue(content || '（见附件）', { images, files, display });
    $('#prompt').focus();
  },

  /* ---------------- Agent 钩子 → DOM ---------------- */
  bindAgent() {
    const box = () => $('#messages');
    const setSumm = (t) => { if (t && t.summ) t.summ.textContent = UI.stepsLabel(t.toolCount, t.totalMs, t.failed); };
    Agent.hooks = {
      onQueue: (n) => {
        const badge = $('#queueBadge'), foot = document.querySelector('.side-foot');
        if (badge) { badge.textContent = n ? `排队 ${n}` : ''; badge.style.display = n ? 'inline-flex' : 'none'; }
        if (foot) foot.classList.toggle('show', n > 0);
      },
      onUser: (m) => {
        const e = box().querySelector('.empty'); if (e) e.remove();
        box().append(UI.userNode(m)); scrollBottom(true);
        this.setRunning(true);
      },
      onStepsStart: () => {
        // 思考块：独立可折叠，默认收起；流式时仍可见标题行
        const thinkInner = el('div', { class: 'inner' }, el('div', { class: 'thinking md' }));
        const thinkSumm = el('span', { class: 'stxt', text: '思考中…' });
        const thinkBox = el('details', { class: 'steps thinkbox', style: 'display:none' },
          el('summary', {}, thinkSumm), thinkInner);
        const thinkBody = thinkInner.querySelector('.thinking');

        // 工具调用块：一行摘要
        const inner = el('div', { class: 'inner' });
        const summ = el('span', { class: 'stxt', text: '正在处理…' });
        const details = el('details', { class: 'steps', open: true }, el('summary', {}, summ), inner);

        // 产物区：常显
        const arts = el('div', { class: 'artifacts', style: 'display:none' });
        const bowl = el('div', { class: 'bubble md', html: '<span class="cursor"></span>' });

        const viz = el('div', { class: 'vizout' });
        const body = el('div', { class: 'body' }, thinkBox, details, viz, arts, bowl);
        const node = el('div', { class: 'msg agent' }, body);
        box().append(node); scrollBottom(true);
        UI.turn = {
          node, details, inner, summ, thinkBox, thinkSumm, thinkBody, viz, arts, bowl,
          stepMap: new Map(), toolCount: 0, totalMs: 0, failed: 0,
          rawText: '', rawThink: '', lastPaint: 0, lastThinkPaint: 0, artIds: new Set()
        };
      },
      onStepStart: () => { const t = UI.turn; if (t && !t.toolCount) t.summ.textContent = '正在思考…'; },
      onDelta: (d, all) => {
        const t = UI.turn; if (!t) return;
        t.rawText = all;
        const now = performance.now();
        if (now - t.lastPaint > 70) {
          t.lastPaint = now;
          t.bowl.innerHTML = MD.render(all) + '<span class="cursor"></span>';
          scrollBottom();
        }
      },
      onThink: (d, all) => {
        const t = UI.turn; if (!t || !State.settings.showThinking) return;
        t.rawThink = all;
        t.thinkBox.style.display = '';
        t.thinkSumm.textContent = '思考中…' + (all.length > 30 ? `（${all.length} 字）` : '');
        const now = performance.now();
        if (now - t.lastThinkPaint > 120) {
          t.lastThinkPaint = now;
          t.thinkBody.innerHTML = MD.render(truncate(all, 4000));
        }
        scrollBottom();
      },
      onAssistantDone: (m, step) => {
        const t = UI.turn; if (!t) return;
        t.bowl.innerHTML = MD.render(m.content || '');
        MD.highlight(t.bowl);
        if (!m.content && m.tool_calls && m.tool_calls.length) t.bowl.style.display = 'none';
        // ★ 非流式提供商 / 演示模型一次性返回 thinking 时，onThink 不会被调用，这里兜底
        if (m.thinking && !t.rawThink) t.rawThink = m.thinking;
        // 思考块收尾：折叠起来，标题显示字数
        if (t.rawThink && State.settings.showThinking) {
          t.thinkBox.style.display = '';
          t.thinkBody.innerHTML = MD.render(truncate(t.rawThink, 4000));
          t.thinkSumm.textContent = '思考过程 · ' + t.rawThink.length + ' 字';
          t.thinkBox.open = false;
        }
        scrollBottom();
      },
      onToolStart: (call) => {
        const t = UI.turn; if (!t) return;
        t.toolCount++;
        const row = UI.stepNode({ name: call.name, args: call.arguments, state: 'running' });
        t.inner.append(row);
        t.stepMap.set(call.id, row);
        t.summ.textContent = `正在执行 ${call.name}…`;
        scrollBottom();
      },
      onToolEnd: (call, out, step) => {
        const t = UI.turn; if (!t) return;
        t.totalMs += out.ms || 0;
        if (out.ok === false) t.failed++;
        const row = t.stepMap.get(call.id);
        if (row) {
          const rg = row.querySelector('.rg');
          rg.className = 'rg ' + (out.ok ? 'ok' : 'err');
          rg.textContent = (out.ok ? '成功' : '失败') + (out.ms ? ' · ' + fmtMs(out.ms) : '');
        }
        if (out.display) {
          const d = out.display;
          if (UI.isArtifactDisplay(d)) {
            // 文件产物：放到常显产物条，不进折叠区
            const items = d.kind === 'artifacts' ? (d.items || []) : [d.art];
            for (const a of items) {
              if (!a || t.artIds.has(a.id)) continue;
              t.artIds.add(a.id);
              t.arts.style.display = '';
              t.arts.append(UI.artifactsBar([a]).firstChild);
            }
          } else if (UI.isVisualDisplay(d)) {
            // 图表/流程图/图片/沙箱：直接可见
            if (d.kind === 'frame') {
              // 只让刚生成的那个自动跑；历史预览保持静止，避免多个页面同时运行
              const key = d._uid || d._key || ('f:' + String(d.title || '') + ':' + String(d.html || '').length + ':' + (d.height || 220));
              d._key = key;
              UI._autoRunKey = key;
            }
            const card = UI.displayNode(d, { name: call.name });
            t.viz.append(card);
            // 图表/图片依赖真实布局尺寸，等一帧再渲染
            requestAnimationFrame(() => { try { window.dispatchEvent(new Event('resize')); } catch { } });
          } else {
            t.inner.append(UI.displayNode(d, { name: call.name }));
          }
        }
        setSumm(t);
        scrollBottom();
      },
      onUsage: () => { UI.updateHeader(); },
      onWarn: (msg) => toast(msg, '', 5000),
      onDone: (text, ms) => {
        this.setRunning(false);
        const t = UI.turn;
        if (t) {
          if (t.toolCount > 0) { t.details.open = false; setSumm(t); }
          else if (t.details.parentNode) t.details.remove();
        }
        UI.renderMessages();
        UI.updateHeader();
        UI.updateMemoryBadge();
      },
      onError: (e) => {
        this.setRunning(false);
        const t = UI.turn;
        const msg = (e && e.message) || String(e);
        // 预算触顶：给「继续执行」，而不是让用户以为程序坏了
        if (e && e.budget) {
          const node = el('div', { class: 'msg agent' }, el('div', { class: 'body' },
            el('div', { class: 'errbox warnbox' },
              el('div', { class: 'errhd', text: '预算护栏触发' }),
              el('div', { class: 'errmsg', text: msg }),
              el('div', { class: 'errhint', text: e.budget.reset
                ? '这是为了防止一次对话花太多钱。点「继续执行」会清零本会话统计后接着做，也可以在 设置 → 预算 里调高或关掉限制。'
                : '单轮工具调用过多会被拦下，避免死循环。点「继续执行」会接着再跑一轮。' }),
              el('div', { class: 'acts' },
                el('button', { class: 'btn sm primary', text: '继续执行', onclick: () => {
                  Agent.resetBudget();
                  node.remove();
                  Agent.regenerate();
                } }),
                el('button', { class: 'btn sm', text: '调高上限', onclick: () => Drawer.open('budget') }),
                el('button', { class: 'btn sm ghost', text: '关闭护栏', onclick: () => {
                  State.settings.budget.unlimited = true; State.saveSettings();
                  toast('已关闭 token / 费用上限（工具次数防死循环仍保留）', 'ok');
                  Drawer.render();
                } })))));
          if (t && t.node.parentNode) t.node.replaceWith(node); else $('#messages').append(node);
          scrollBottom(true);
          return;
        }
        let hint = '';
        if (/Failed to fetch|NetworkError|load failed/i.test(msg)) hint = '常见原因：① 浏览器 CORS 拦截（设置 → 模型 填代理地址）② Base URL 写错 ③ file:// 下部分浏览器限制请求。';
        else if (/401|403/.test(msg)) hint = 'Key 无效或无权限。';
        else if (/429/.test(msg)) hint = '触发限流，稍后再试或降低并发。';
        const node = el('div', { class: 'msg agent' }, el('div', { class: 'body' },
          el('div', { class: 'errbox' },
            el('div', { class: 'errhd', text: '请求失败' }),
            el('div', { class: 'errmsg', text: msg }),
            hint ? el('div', { class: 'errhint', text: hint }) : null,
            el('div', { class: 'acts' },
              el('button', { class: 'btn sm primary', text: '重试', onclick: () => Agent.regenerate() }),
              el('button', { class: 'btn sm', text: '打开设置', onclick: () => Drawer.open('model') })))));
        if (t && t.node.parentNode) t.node.replaceWith(node); else $('#messages').append(node);
        scrollBottom(true);
      },
      onAborted: () => {
        this.setRunning(false);
        const t = UI.turn;
        if (t) {
          if (t.toolCount > 0) { t.details.open = false; setSumm(t); }
          if (!t.rawText) t.bowl.innerHTML = '<span style="color:var(--text-placeholder)">（已停止）</span>';
        }
        UI.renderMessages();
      },
      onIdle: () => { this.setRunning(false); UI.updateHeader(); }
    };
  },

  setRunning(run) {
    Agent.busy = run;
    $('#btnSend').style.display = run ? 'none' : '';
    $('#btnStop').style.display = run ? '' : 'none';
    $('#prompt').placeholder = run ? '正在执行，可继续输入排队…' : '给 Agent 一个任务…';
  },

  /* ---------------- 导入导出 ---------------- */
  exportSession(fmt) {
    const s = State.current();
    if (!s.messages.length) return toast('当前会话为空', 'err');
    if (fmt === 'json') {
      downloadBlob(new Blob([JSON.stringify(s, null, 2)], { type: MIME.json }), safeName(s.title) + '.json');
      return;
    }
    let md = `# ${s.title}\n\n> 导出时间：${fmtTime(Date.now())}　模型：${curModelLabel()}\n\n`;
    for (const m of s.messages) {
      if (m.role === 'user') md += `## 🧑 用户\n\n${m.content}\n\n`;
      else if (m.role === 'assistant') {
        md += `## 🤖 Agent\n\n`;
        if (m.tool_calls && m.tool_calls.length) md += m.tool_calls.map((c) => `- 工具 \`${c.name}\`：\`${truncate(JSON.stringify(c.arguments), 300)}\``).join('\n') + '\n\n';
        if (m.thinking) md += `> 思考：${m.thinking.replace(/\n/g, ' ')}\n\n`;
        md += `${m.content || ''}\n\n`;
      } else if (m.role === 'tool') md += `> 工具结果 ${m.name}：${truncate(m.content, 600)}\n\n`;
    }
    downloadBlob(new Blob([md], { type: MIME.md }), safeName(s.title) + '.md');
  },
  exportSettings() {
    const clone = JSON.parse(JSON.stringify(State.settings));
    // 导出时不带 Key
    for (const p of Object.values(clone.providers)) p.apiKey = '';
    clone.search.deepseekKey = clone.search.tavilyKey = clone.search.serperKey = '';
    clone.image.arkKey = clone.image.qwenKey = '';
    downloadBlob(new Blob([JSON.stringify({ settings: clone, plugins: State.plugins }, null, 2)], { type: MIME.json }), 'aaim-agent-config.json');
    toast('已导出（不含 API Key）', 'ok');
  },
  importSettings(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        if (j.settings) State.settings = mergeDefaults(j.settings, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)));
        if (Array.isArray(j.plugins)) { State.plugins = j.plugins; this.loadPlugins(); }
        State.saveSettings();
        UI.updateHeader(); Drawer.render();
        toast('配置已导入', 'ok');
      } catch (e) { toast('导入失败：' + e.message, 'err'); }
    };
    r.readAsText(file);
  },
  exportAudit() {
    if (!State.audit.length) return toast('暂无审计记录', 'err');
    downloadBlob(new Blob([JSON.stringify(State.audit, null, 2)], { type: MIME.json }), 'aaim-agent-audit.json');
  },

  /* ---------------- 插件（L6） ---------------- */
  loadPlugins() {
    for (const p of State.plugins) {
      try {
        Tools.register({
          name: p.name, desc: p.desc, params: p.params || { type: 'object', properties: {} },
          category: 'plugin', sensitive: !!p.sensitive, enabled: p.enabled !== false,
          async run(args) {
            const r = await Sandbox.runJS(`var args = ${JSON.stringify(args || {})};\n${p.code}`, { timeout: 8000 });
            if (!r.ok) return { ok: false, summary: '插件执行失败：' + r.error };
            const res = typeof r.result === 'string' ? r.result : JSON.stringify(r.result, null, 2);
            return { ok: true, summary: `插件 ${p.name} 返回：\n${truncate(res, 3000)}`, display: { kind: 'code', code: p.code, result: res, logs: r.logs } };
          }
        });
      } catch (e) { console.warn('插件注册失败', p.name, e); }
    }
  },

  /* ---------------- 启动 ---------------- */
  boot() {
    // 主题
    document.documentElement.dataset.theme = State.settings.theme || 'dark';
    this.loadPlugins();
    UI.init();
    this.initComposer();
    this.bindAgent();
    this.setRunning(false);
    // 顶栏按钮
    $('#btnNew').addEventListener('click', () => UI.newSession());
    // 移动端侧栏：四种关闭方式（按钮 / 遮罩 / 选会话 / Esc）
    $('#btnMenu').addEventListener('click', () => this.toggleNav());
    $('#btnNavClose').addEventListener('click', () => this.closeNav());
    $('#navMask').addEventListener('click', () => this.closeNav());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('nav-open')) { e.stopPropagation(); this.closeNav(); }
    }, true);
    // 视口变宽时自动收起，避免残留状态
    window.addEventListener('resize', debounce(() => { if (window.innerWidth > 900) this.closeNav(false); }, 150));
    $('#btnTheme').addEventListener('click', () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = t; State.settings.theme = t; State.saveSettings();
      this.setThemeIcon(t);
    });
    this.setThemeIcon(State.settings.theme);
    $('#btnSettings').addEventListener('click', () => Drawer.open('model'));
    // 顶栏模式切换：单 Agent ⇄ 企业团队
    $('#modeChip').addEventListener('click', () => this.toggleOrgMode());
    // 更多菜单
    const menu = $('#moreMenu');
    $('#btnMore').addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('open'); UI.updateMemoryBadge(); });
    document.addEventListener('click', (e) => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
    menu.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => {
      menu.classList.remove('open');
      const k = b.dataset.m;
      if (k === 'org') OrgUI.applyMode(true);
      if (k === 'memory') Drawer.open('memory');
      if (k === 'spec') Drawer.open('spec');
      if (k === 'export') this.exportMenu();
      if (k === 'usage') Drawer.open('budget');
      if (k === 'clear') this.clearSession();
      if (k === 'import') $('#importFile').click();
    }));
    // 本机文件
    $('#btnLocal').addEventListener('click', () => this.pickLocalFiles());
    $('#importFile').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) this.importSettings(f); e.target.value = ''; });
    if ('speechSynthesis' in window) { TTS.load(); speechSynthesis.onvoiceschanged = () => TTS.load(); }
    // 用量条 & 状态
    UI.updateHeader();
    UI.updateMemoryBadge();
    // 恢复上次的模式，并初始化企业面板
    OrgUI.init();
    if (State.org && State.org.enabled) OrgUI.applyMode(true);
    UI.updateModeChip();
    // 规格面板等首次渲染
    Drawer.init();
    // 欢迎
    if (!State.sessions.length) { const s = newSession('欢迎使用'); State.sessions.push(s); State.currentId = s.id; State.saveSessions(); UI.renderSessions(); }
    if (!curKeyReady() && State.settings.provider === 'mock') {
      toast('当前是内置演示模型（无需 Key）。要接真模型：右上角 ⚙ → 模型', '', 6000);
    }
    $('#prompt').focus();
    // 后台清理过期产物（14 天 / 最多 80 个），避免 IndexedDB 无限增长
    setTimeout(() => { if (typeof ArtifactStore !== 'undefined') ArtifactStore.prune().catch(() => { }); }, 3000);
    console.log('[Aaim Agent] ready', APP.version, '工具数', Tools.active().length);
  },

  setThemeIcon(theme) {
    const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>';
    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.7 8.7 0 1 0 11.3 11.3z"/></svg>';
    const b = $('#btnTheme');
    if (!b) return;
    b.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
    b.title = theme === 'dark' ? '切换到浅色' : '切换到深色';
  },

  /** 切换企业式多 Agent 模式 */
  toggleOrgMode() {
    const next = !(State.org && State.org.enabled);
    if (next) {
      Org.data.enabled = true;
      Org.save();
      // 首次进入：保证有最简可用的团队（领导 + 检查者已由 defaults 提供）
      if (!Org.validate().ok) { try { Org.data = Org.defaults(); Org.save(); } catch { } }
      OrgUI.applyMode(true);
      UI.updateModeChip();
      toast('已开启企业模式：目标交给大领导，由它拆解、派活、请检查者验收', 'ok', 4000);
    } else {
      Org.data.enabled = false; Org.save();
      OrgUI.applyMode(false);
      UI.updateModeChip();
      toast('已切回单 Agent 模式');
      UI.renderMessages();
    }
  },

  /* ---------------- 移动端侧栏开合 ---------------- */
  toggleNav() {
    if (document.body.classList.contains('nav-open')) this.closeNav();
    else this.openNav();
  },
  openNav() {
    document.body.classList.add('nav-open');
    const b = $('#btnMenu');
    if (b) b.setAttribute('aria-expanded', 'true');
    const c = $('#btnNavClose');
    if (c) c.focus({ preventScroll: true });
  },
  closeNav(restoreFocus = true) {
    if (!document.body.classList.contains('nav-open')) return;
    document.body.classList.remove('nav-open');
    const b = $('#btnMenu');
    if (b) {
      b.setAttribute('aria-expanded', 'false');
      if (restoreFocus) b.focus({ preventScroll: true });
    }
  },

  clearSession() {
    const s = State.current();
    if (!s.messages.length) return toast('已经是空会话');
    openModal({
      title: '清空当前会话', bodyHTML: '<div>将删除本会话的全部消息，不可撤销。要保留副本请先导出。</div>', okText: '清空', okClass: 'danger',
      onOk: () => { s.messages = []; s.title = '新会话'; State.saveSessions(); UI.renderMessages(); UI.updateHeader(); UI.renderSessions(); }
    });
  },

  /** 打开本机文件（可被 Agent 直接修改） */
  async pickLocalFiles() {
    if (!LocalFiles.supported()) {
      return toast('当前浏览器不支持直接读写本机文件（需 Chrome/Edge 86+）。可改用 ＋ 附件做只读解析。', 'err', 6000);
    }
    try {
      const recs = await LocalFiles.openPicker({ multiple: true });
      if (!recs.length) return;
      const list = LocalFiles.list();
      const box = $('#messages');
      const e = box.querySelector('.empty'); if (e) e.remove();
      box.append(el('div', { class: 'msg agent' }, el('div', { class: 'body' },
        el('div', { class: 'toolcard' },

          if (a === 'audit') this.exportAudit();
          if (a === 'print') window.print();
        }));
        return false; // 保持打开
      }
    });

/* ============ 11 设置抽屉：骨架 + 表单组件 ============ */
const Form = {
  field(label, input, hint) {
    return el('div', { class: 'field' }, el('label', { text: label }), input, hint ? el('div', { class: 'hint', text: hint }) : null);
  },
  text(value, onchange, opts = {}) {
    const i = el('input', { type: 'text', value: value == null ? '' : value, placeholder: opts.ph || '', autocomplete: 'off', spellcheck: 'false' });
    i.addEventListener('change', () => onchange(i.value.trim()));
    return i;
  },
  pass(value, onchange, ph) {
    const wrap = el('div', { class: 'row' });
    const i = el('input', { type: 'password', value: value || '', placeholder: ph || 'sk-...', autocomplete: 'off' });
    const eye = el('button', { class: 'btn sm', text: '👁', title: '显示/隐藏' });
    eye.addEventListener('click', () => { i.type = i.type === 'password' ? 'text' : 'password'; });
    i.addEventListener('change', () => onchange(i.value.trim()));
    wrap.append(i, eye);
    return wrap;
  },
  num(value, onchange, { min, max, step } = {}) {
    const i = el('input', { type: 'number', value: value, min: min, max: max, step: step || 1 });
    i.addEventListener('change', () => { const v = Number(i.value); if (!isNaN(v)) onchange(v); });
    return i;
  },
  area(value, onchange, ph) {
    const t = el('textarea', { placeholder: ph || '' });
    t.value = value || '';
    t.addEventListener('change', () => onchange(t.value));
    return t;
  },
  select(options, value, onchange) {
    const s = el('select');
    for (const [v, label] of options) s.append(el('option', { value: v, text: label, selected: String(v) === String(value) }));
    s.addEventListener('change', () => onchange(s.value));
    return s;
  },
  toggle(label, desc, value, onchange) {
    const sw = el('div', { class: 'sw' + (value ? ' on' : '') });
    sw.addEventListener('click', () => {
      const on = !sw.classList.contains('on');
      sw.classList.toggle('on', on);
      onchange(on);
    });
    return el('div', { class: 'switch' }, el('div', { class: 'lbl', text: label }, desc ? el('small', { text: desc }) : null), sw);
  },
  sect(text) { return el('div', { class: 'sect', text }); },
  kv(k, v) { return el('div', { class: 'kv' }, el('span', { text: k }), el('b', { text: v })); }
};

const Drawer = {
  tab: 'model',
  TABS: [['model', '模型'], ['search', '搜索'], ['image', '图片'], ['kb', '知识库'], ['memory', '记忆'], ['local', '本机文件'], ['tools', '工具'], ['budget', '预算'], ['spec', '规格'], ['about', '关于']],

  init() {
    $('#drawerClose').addEventListener('click', () => this.close());
    // 知识库导入：File 选择后解析并入库（支持 Word / Excel / PPT / PDF / 文本）
    $('#kbFile').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;
      for (const f of files) {
        const t = toast(`解析 ${f.name}…`, '', 60000);
        try {
          let text = '';
          const ext = DocParser.ext(f.name);
          if (DocParser.isOffice(f.name) || ext === 'pdf') {
            const r = await DocParser.read(f, f.name);
            text = r.text || '';
          } else {
            text = await f.text();
          }
          if (!text.trim()) throw new Error('没有提取到文字内容');
          const doc = KB.addDoc(f.name, text);
          toast(`已入库 ${f.name}（${doc.chunks} 段 / ${text.length} 字）`, 'ok');
        } catch (err) {
          toast(`${f.name} 导入失败：${err.message}`, 'err', 7000);
        } finally { t.remove(); }
      }
      this.render();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').classList.contains('open')) this.close(); });
  },
  open(tab) {
    this.tab = tab || this.tab || 'model';
    $('#drawer').classList.add('open');
    this.render();
  },
  close() { $('#drawer').classList.remove('open'); },

  render() {
    const tabs = $('#drawerTabs');
    tabs.innerHTML = '';
    for (const [k, label] of this.TABS) {
      tabs.append(el('div', { class: 'tab' + (k === this.tab ? ' on' : ''), text: label, onclick: () => { this.tab = k; this.render(); } }));

    const body = $('#drawerBody');
    body.innerHTML = '';
    const fn = { model: this.renderModel, search: this.renderSearch, image: this.renderImage, kb: this.renderKb, memory: this.renderMemory, local: this.renderLocal, tools: this.renderTools, budget: this.renderBudget, spec: this.renderSpec, about: this.renderAbout }[this.tab];
    if (fn) fn.call(this, body);
    body.scrollTop = 0;

    openModal({

        Tools.register({

/* ============ 13 长期记忆：跨会话事实库 ============ */
const Memory = {
  KEY: 'memory',
  list() {
    const v = Store.get(this.KEY, []);
    return Array.isArray(v) ? v : [];
  },
  save(arr) { Store.set(this.KEY, arr.slice(0, 300)); return arr; },
  add(text, source = 'user') {
    const t = String(text || '').trim();
    if (!t) return null;
    const arr = this.list();
    // 去重：完全相同或高度相似（前 24 字相同）则不重复存
    const sig = t.slice(0, 24).toLowerCase();
    const dup = arr.find((x) => x.text.toLowerCase() === t.toLowerCase() || x.text.slice(0, 24).toLowerCase() === sig);
    if (dup) { dup.ts = Date.now(); this.save(arr); return dup; }
    const item = { id: uid('mem'), text: t.slice(0, 1200), ts: Date.now(), source };
    arr.unshift(item);
    this.save(arr);
    return item;
  },
  remove(id) { this.save(this.list().filter((x) => x.id !== id)); },
  update(id, text) {
    const arr = this.list();
    const it = arr.find((x) => x.id === id);
    if (it) { it.text = String(text).slice(0, 1200); it.ts = Date.now(); this.save(arr); }
  },
  clear() { this.save([]); },
  count() { return this.list().length; },
  /** 注入系统提示的记忆块；按 token 预算截断，新的优先 */
  promptBlock(limit = 1600) {
    const arr = this.list();
    if (!arr.length) return '';
    const head = '【长期记忆】以下是用户在过往会话中确认过、需要长期遵守的事实与偏好（与本轮对话无关的不要强行套用；与用户当前说法冲突时，以当前说法为准）：';
    let out = '';
    for (const m of arr) {
      const line = '- ' + m.text.replace(/\n+/g, ' ');
      if ((out + line).length > limit) break;
      out += line + '\n';
    }
    return head + '\n' + out.trimEnd();
  },
  /** 供 recall 工具使用：关键词粗筛 */
  search(q, k = 8) {
    const arr = this.list();
    const terms = String(q || '').toLowerCase().split(/[\s,，、]+/).filter(Boolean);
    if (!terms.length) return arr.slice(0, k);
    const scored = arr.map((m) => {
      const t = m.text.toLowerCase();
      let s = 0;
      for (const term of terms) if (t.includes(term)) s += 2;
      if (t.includes(String(q).toLowerCase())) s += 3;
      return { ...m, _s: s };
    }).filter((x) => x._s > 0).sort((a, b) => b._s - a._s);
    return scored.slice(0, k);
  }
};
