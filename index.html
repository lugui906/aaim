/* ============ 14 本机文件读写（File System Access API，需用户授权） ============ */
const LocalFiles = {
  files: new Map(),          // id -> { id, name, handle, text, size, writable }
  lastActiveId: '',

  supported() { return typeof window.showOpenFilePicker === 'function'; },

  /** 必须是用户手势触发（按钮点击） */
  async openPicker({ multiple = true, types = null } = {}) {
    if (!this.supported()) throw new Error('当前浏览器不支持直接读写本机文件（需 Chrome/Edge 86+）。可改用「上传附件」只读解析。');
    const opts = { multiple, excludeAcceptAllOption: false };
    opts.types = types || [{
      description: '文档与文本',
      accept: {
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'],
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'],
        'application/vnd.openxmlformats-officedocument.presentationml.presentation': ['.pptx'],
        'application/pdf': ['.pdf'],
        'text/plain': ['.txt', '.md', '.markdown', '.csv', '.json', '.log', '.yml', '.yaml'],
        'application/json': ['.json'],
        'text/javascript': ['.js', '.mjs', '.ts'],
        'text/html': ['.html'], 'text/css': ['.css'],
        'application/vnd.ms-excel': ['.xls']
      }
    }];
    const handles = await window.showOpenFilePicker(opts);
    const out = [];
    for (const h of handles) {
      const f = await h.getFile();
      const text = await this._readText(f);
      const rec = {
        id: uid('lf'), name: f.name, handle: h, size: f.size,
        text, lastModified: f.lastModified,
        writable: this._isWritable(h)
      };
      this.files.set(rec.id, rec);
      this.lastActiveId = rec.id;
      out.push(rec);
    }
    return out;
  },

  _isWritable(h) {
    try { return h.queryPermission && h.requestPermission ? undefined : undefined; } catch { return undefined; }
  },

  async _readText(file) {
    const name = file.name || '';
    const ext = DocParser.ext(name);
    // 办公文档 / PDF：走解析器
    if (DocParser.isOffice(name) || ext === 'pdf') {
      if (file.size > 40 * 1024 * 1024) return '[文件超过 40MB，未自动解析]';
      try {
        const r = await DocParser.read(file, name);
        return r.text || '';
      } catch (e) {
        return `[解析失败：${e.message}]`;
      }
    }
    const isTexty = /^text\//.test(file.type) || /\.(txt|md|markdown|csv|json|js|mjs|cjs|ts|tsx|jsx|py|html|htm|css|scss|xml|yaml|yml|log|ini|conf|sh|bat|ps1|java|c|h|cpp|hpp|rs|go|rb|php|sql|toml|env|gitignore)$/i.test(name);
    if (!isTexty && file.size > 2 * 1024 * 1024) return null;   // 二进制大文件不读
    try { return await file.text(); } catch { return null; }
  },

  find(nameOrId) {
    if (!nameOrId) { const r = this.files.get(this.lastActiveId); return r || null; }
    if (this.files.has(nameOrId)) return this.files.get(nameOrId);
    for (const f of this.files.values()) if (f.name === nameOrId) return f;
    for (const f of this.files.values()) if (f.name.includes(nameOrId)) return f;
    return null;
  },

  list() {
    return Array.from(this.files.values()).map((f) => ({
      id: f.id, name: f.name, size: f.size,
      chars: f.text == null ? null : f.text.length,
      textFile: f.text != null, active: f.id === this.lastActiveId
    }));
  },

  /** 真正写入；必须由用户点击触发以获取写权限 */
  async write(id, content) {
    const rec = this.files.get(id);
    if (!rec) throw new Error('文件句柄已失效，请重新打开文件');
    if (rec.text == null) throw new Error('该文件不是文本文件，未读取内容，不能覆盖写入');
    let perm = 'granted';
    if (rec.handle.queryPermission) perm = await rec.handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && rec.handle.requestPermission) perm = await rec.handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') throw new Error('用户未授予写入权限');
    const w = await rec.handle.createWritable();
    await w.write(content);
    await w.close();
    rec.text = content;
    return { name: rec.name, chars: content.length };
  },

  /** 另存为（也可用于新建文件） */
  async saveAs(suggestedName, content) {
    if (typeof window.showSaveFilePicker !== 'function') throw new Error('当前浏览器不支持「另存为」（需 Chrome/Edge）');
    const h = await window.showSaveFilePicker({ suggestedName: safeName(suggestedName || 'untitled.txt', 'untitled.txt') });
    let perm = 'granted';
    if (h.queryPermission) perm = await h.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && h.requestPermission) perm = await h.requestPermission({ mode: 'readwrite' });
    const w = await h.createWritable();
    await w.write(content);
    await w.close();
    const rec = { id: uid('lf'), name: h.name, handle: h, size: content.length, text: content, lastModified: Date.now() };
    this.files.set(rec.id, rec);
    this.lastActiveId = rec.id;
    return { id: rec.id, name: h.name, chars: content.length };
  },

  /** 行级 diff（只做可视化，不参与写入） */
  diff(oldText, newText) {
    const a = String(oldText || '').split('\n');
    const b = String(newText || '').split('\n');
    const out = [];
    const n = Math.max(a.length, b.length);
    // 简单 LCS 片段：先用公共前后缀裁剪，中间整体按变更处理（足够看清改了什么）
    let pre = 0;
    while (pre < a.length && pre < b.length && a[pre] === b[pre]) pre++;
    let sufA = a.length, sufB = b.length;
    while (sufA > pre && sufB > pre && a[sufA - 1] === b[sufB - 1]) { sufA--; sufB--; }
    const ctx = 3;
    const s = Math.max(0, pre - ctx), e = Math.min(a.length, sufA + ctx);
    for (let i = s; i < pre; i++) out.push({ t: ' ', s: a[i], n: i + 1 });
    for (let i = pre; i < sufA; i++) out.push({ t: '-', s: a[i], n: i + 1 });
    const newStart = pre;
    for (let i = pre; i < sufB; i++) out.push({ t: '+', s: b[i], n: i - newStart + 1 });
    for (let i = sufA; i < e; i++) out.push({ t: ' ', s: a[i], n: i + 1 });
    const added = out.filter((x) => x.t === '+').length;
    const removed = out.filter((x) => x.t === '-').length;
    return { rows: out, added, removed, unchanged: pre + (a.length - sufA) };
  }
};

  params: {
    type: 'object',
    properties: {
      name: { type: 'string', description: '目标文件名（可部分匹配）；留空用最近打开的文件' },
      mode: { type: 'string', description: 'replace 或 patch，默认 patch' },
      content: { type: 'string', description: 'mode=replace 时的新全文' },
      find: { type: 'string', description: 'mode=patch 时要替换的原文（必须唯一且逐字一致）' },
      replace: { type: 'string', description: 'mode=patch 时替换成的内容' },
      all: { type: 'boolean', description: 'patch 模式下是否替换所有出现，默认 false（只替换唯一匹配）' }
    },
    required: ['name']
  },
  async run(args) {
    const rec = LocalFiles.find(args.name);
    if (!rec) throw new Error('没有找到该文件。请用户点击「📂」按钮先选择它。');
    if (rec.text == null) throw new Error('该文件不是文本文件，不能编辑');
    const mode = args.mode === 'replace' ? 'replace' : 'patch';
    let next;
    if (mode === 'replace') {
      if (State.settings.localAllowReplace === false) throw new Error('设置里已关闭「允许整文件覆盖」，请改用 mode=patch 精确替换');
      if (typeof args.content !== 'string') throw new Error('mode=replace 需要 content');
      next = args.content;
    } else {
      if (!args.find) throw new Error('mode=patch 需要 find');
      const occurrences = rec.text.split(args.find).length - 1;
      if (occurrences === 0) throw new Error('原文里找不到要替换的片段，请先用 local_read_file 确认实际内容（注意缩进与换行）');
      if (occurrences > 1 && !args.all) throw new Error(`该片段出现 ${occurrences} 次，请补充上下文使其唯一，或设置 all=true`);
      next = args.all ? rec.text.split(args.find).join(args.replace || '') : rec.text.replace(args.find, args.replace || '');

    const d = LocalFiles.diff(rec.text, next);
    return {
      ok: true,
      summary: `已准备好「${rec.name}」的修改：+${d.added} 行 / -${d.removed} 行。需要用户点击卡片上的「写入文件」才会真正保存。`,

    };

});

/* ===== 16-docparse.js ===== */
/* ============ 16 办公文档解析：docx / xlsx / pptx（真实提取文本与表格） ============ */
const DocParser = {
  /** 扩展名 */
  ext(name) {
    const m = /\.([a-z0-9]+)$/i.exec(String(name || ''));
    return m ? m[1].toLowerCase() : '';
  },
  /** 需要走办公文档解析的类型 */
  OFFICE: ['docx', 'xlsx', 'pptx', 'xls', 'csv'],
  /** 浏览器端无法解析的老二进制格式 */
  LEGACY: { doc: 'Word 97-2003（.doc）', xls: 'Excel 97-2003（.xls）→ 可直接读，见下', ppt: 'PowerPoint 97-2003（.ppt）', wps: 'WPS 文字（.wps）', et: 'WPS 表格（.et）', dps: 'WPS 演示（.dps）' },
  /** 这些可以读 */
  READABLE: ['docx', 'xlsx', 'pptx', 'xls', 'csv'],

  isOffice(name) {
    return this.READABLE.includes(this.ext(name));
  },
  /** 明确不支持、要给出指引的 */
  unsupportedHint(name) {
    const e = this.ext(name);
    if (e === 'doc' || e === 'wps' || e === 'rtf') return '这是旧版 Word / WPS 格式，浏览器无法直接解析。请用 Word/WPS「另存为 .docx」后再上传。';
    if (e === 'ppt' || e === 'dps') return '这是旧版 PPT / WPS 演示格式，请用 PowerPoint/WPS「另存为 .pptx」后再上传。';
    if (e === 'pages') return 'Pages 格式不支持，请导出为 .docx 或 PDF。';
    if (e === 'numbers') return 'Numbers 格式不支持，请导出为 .xlsx 或 CSV。';
    if (e === 'key') return 'Keynote 格式不支持，请导出为 .pptx 或 PDF。';
    if (e === 'zip' || e === 'rar' || e === '7z') return '压缩包请先解压，再逐个上传里面的文档。';
    if (e === 'enc' || e === 'pdf_enc') return '文件已加密，无法解析。';
    return '';
  },

  /** 统一入口：File / Blob → { text, meta } */
  async read(file, name) {
    const fname = name || file.name || 'file';
    const e = this.ext(fname);
    if (e === 'pdf') return { text: await readPdfBlob(file), meta: { kind: 'pdf' } };
    if (e === 'docx') return await this.docx(file, fname);
    if (e === 'xlsx' || e === 'xls' || e === 'csv') return await this.xlsx(file, fname);
    if (e === 'pptx') return await this.pptx(file, fname);
    const hint = this.unsupportedHint(fname);
    if (hint) throw new Error(hint);
    throw new Error(`不支持的格式：.${e || '?'}（支持 PDF / DOCX / XLSX / PPTX / XLS / CSV / TXT / MD / JSON / 图片）`);
  },

  async readBuffer(buf, name) {
    return this.read(new Blob([buf]), name);
  },

  /* ---------------- DOCX ---------------- */
  async docx(blob, fname) {
    await CDN.load('jszip');
    const JSZip = window.JSZip;
    let zip;
    try { zip = await JSZip.loadAsync(await blob.arrayBuffer()); }
    catch (e) { throw new Error('不是有效的 docx（可能已损坏或其实是 .doc 改扩展名）'); }
    const docFile = zip.file('word/document.xml');
    if (!docFile) throw new Error('docx 内缺少 word/document.xml，文件可能已损坏');
    const xml = await docFile.async('string');
    const dom = new DOMParser().parseFromString(xml, 'application/xml');
    if (dom.getElementsByTagName('parsererror').length) throw new Error('document.xml 解析失败');

    const lines = [];
    const body = dom.getElementsByTagName('w:body')[0] || dom.documentElement;
    const MAX = 3000;

    const paraText = (p) => {
      let s = '';
      const walk = (node) => {
        for (const c of node.childNodes) {
          if (c.nodeType !== 1) continue;
          const tag = c.tagName;
          if (tag === 'w:t') s += c.textContent || '';
          else if (tag === 'w:tab') s += '\t';
          else if (tag === 'w:br' || tag === 'w:cr') s += '\n';
          else if (tag === 'w:drawing' || tag === 'w:pict') s += '[图片]';
          else if (tag === 'w:hyperlink' || tag === 'w:r' || tag === 'w:ins' || tag === 'w:smartTag') walk(c);
          else if (tag === 'w:delText') { }
        }
      };
      walk(p);
      return s;
    };

    const headingLevel = (p) => {
      const st = p.getElementsByTagName('w:pStyle')[0];
      if (!st) return 0;
      const v = st.getAttribute('w:val') || '';
      const m = /^(?:Heading|heading|标题)\s*(\d)/.exec(v);
      if (m) return Math.min(6, Number(m[1]));
      if (/^(Title|标题)$/i.test(v)) return 1;
      return 0;
    };

    const tableText = (tbl) => {
      const rows = [];
      for (const tr of tbl.getElementsByTagName('w:tr')) {
        const cells = [];
        for (const tc of tr.getElementsByTagName('w:tc')) {
          const parts = [];
          for (const p of tc.getElementsByTagName('w:p')) {
            const t = paraText(p).trim();
            if (t) parts.push(t);
          }
          cells.push(parts.join(' ').replace(/\|/g, '\\|'));
        }
        if (cells.length) rows.push(cells);
      }
      if (!rows.length) return '';
      const cols = Math.max(...rows.map((r) => r.length));
      const norm = rows.map((r) => { const c = r.slice(); while (c.length < cols) c.push(''); return c; });
      let out = '\n| ' + norm[0].join(' | ') + ' |\n| ' + norm[0].map(() => '---').join(' | ') + ' |\n';
      for (let i = 1; i < norm.length; i++) out += '| ' + norm[i].join(' | ') + ' |\n';
      return out + '\n';
    };

    const isNoise = (t) => /^\s*\d+\s*(\/|of)\s*\d+\s*$/i.test(t) || /^\s*第\s*\d+\s*页\s*$/.test(t);

    let count = 0;
    for (const node of body.children) {
      if (count++ > MAX) { lines.push('…（文档过长，后续内容已省略）'); break; }
      const tag = node.tagName;
      if (tag === 'w:p') {
        const t = paraText(node);
        const lvl = headingLevel(node);
        if (t.trim()) { if (!isNoise(t.trim())) lines.push(lvl ? '#'.repeat(lvl) + ' ' + t.trim() : t.trim()); }
        else lines.push('');
      } else if (tag === 'w:tbl') {
        const t = tableText(node);
        if (t) lines.push(t);
      } else if (tag === 'w:sdt') {
        const inner = node.getElementsByTagName('w:p');
        for (const p of inner) { const t = paraText(p).trim(); if (t) lines.push(t); }
      }
    }

    const text = lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    if (!text) throw new Error('这个 docx 里没有可提取的文字（可能整篇是图片扫描件，需要 OCR）');

    // 附带的元信息
    let title = '';
    try {
      const core = zip.file('docProps/core.xml');
      if (core) {
        const cx = await core.async('string');
        const cd = new DOMParser().parseFromString(cx, 'application/xml');
        title = (cd.getElementsByTagName('dc:title')[0] || {}).textContent || '';
      }
    } catch { }
    return {
      text,
      meta: { kind: 'docx', title, paragraphs: text.split('\n').filter(Boolean).length, ext: 'docx' }
    };
  },

  /* ---------------- XLSX / XLS / CSV ---------------- */
  async xlsx(blob, fname) {
    await CDN.load('xlsx');
    const XLSX = window.XLSX;
    let wb;
    const buf = await blob.arrayBuffer();
    try {
      wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true, raw: true });
    } catch (e) {
      throw new Error('表格解析失败：' + e.message + '（若是 .xls 且带密码，请先另存为 .xlsx）');
    }
    if (!wb || !wb.SheetNames || !wb.SheetNames.length) throw new Error('这个表格里没有工作表');
    const out = [];
    let totalRows = 0;
    for (const sn of wb.SheetNames.slice(0, 20)) {
      const ws = wb.Sheets[sn];
      if (!ws) continue;
      let rows;
      try { rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '', raw: true }); }
      catch { continue; }
      // 统一成可读字符串：日期用 YYYY-MM-DD，数字保持干净（不带千分位，方便计算）
      const fmtCell = (v) => {
        if (v == null) return '';
        if (v instanceof Date && !isNaN(v)) {
          const p2 = (n) => String(n).padStart(2, '0');
          // 用本地分量：sheetjs 把 Excel 日期序列号按本地时区还原成 Date，用 UTC 分量会整体偏一个时区
          const hasTime = v.getHours() || v.getMinutes() || v.getSeconds();
          return `${v.getFullYear()}-${p2(v.getMonth() + 1)}-${p2(v.getDate())}` + (hasTime ? ` ${p2(v.getHours())}:${p2(v.getMinutes())}` : '');
        }
        if (typeof v === 'number') return String(v);
        if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
        return String(v);
      };
      rows = rows.map((r) => (Array.isArray(r) ? r.map(fmtCell) : [fmtCell(r)]));
      if (!rows || !rows.length) { out.push(`## 工作表：${sn}\n（空）\n`); continue; }
      const cols = Math.min(30, Math.max(...rows.map((r) => r.length)));
      const cap = rows.slice(0, 300).map((r) => {
        const c = r.slice(0, cols).map((v) => String(v == null ? '' : v).replace(/\|/g, '\\|').replace(/\n/g, ' '));
        while (c.length < cols) c.push('');
        return c;
      });
      let tbl = `## 工作表：${sn}（${rows.length} 行 × ${cols} 列）\n\n`;
      tbl += '| ' + cap[0].join(' | ') + ' |\n| ' + cap[0].map(() => '---').join(' | ') + ' |\n';
      for (let i = 1; i < cap.length; i++) tbl += '| ' + cap[i].join(' | ') + ' |\n';
      if (rows.length > cap.length) tbl += `\n…（还有 ${rows.length - cap.length} 行未展开）\n`;
      out.push(tbl);
      totalRows += rows.length;
    }
    const text = out.join('\n').trim();
    if (!text) throw new Error('未能从表格中提取到内容');
    return { text, meta: { kind: 'xlsx', sheets: wb.SheetNames.length, rows: totalRows, ext: 'xlsx' } };
  },

  /* ---------------- PPTX ---------------- */
  async pptx(blob, fname) {
    await CDN.load('jszip');
    const JSZip = window.JSZip;
    let zip;
    try { zip = await JSZip.loadAsync(await blob.arrayBuffer()); }
    catch (e) { throw new Error('不是有效的 pptx（可能已损坏或其实是 .ppt 改扩展名）'); }

    const slideFiles = Object.keys(zip.files)
      .filter((p) => /^ppt\/slides\/slide\d+\.xml$/.test(p))
      .sort((a, b) => {
        const na = Number((/slide(\d+)\.xml$/.exec(a) || [])[1] || 0);
        const nb = Number((/slide(\d+)\.xml$/.exec(b) || [])[1] || 0);
        return na - nb;
      });
    if (!slideFiles.length) throw new Error('pptx 内没有找到幻灯片');

    const notesMap = {};
    for (const p of Object.keys(zip.files)) {
      const m = /^ppt\/notesSlides\/notesSlide(\d+)\.xml$/.exec(p);
      if (m) notesMap[Number(m[1])] = p;
    }

    const out = [];
    // 去掉页码、"第 x 页"、纯数字等版式噪音
    const isNoise = (t) => /^\s*\d+\s*(\/|of)\s*\d+\s*$/i.test(t) || /^\s*第\s*\d+\s*页\s*$/.test(t) || /^\s*\d{1,3}\s*$/.test(t);

    for (let i = 0; i < slideFiles.length; i++) {
      const xml = await zip.file(slideFiles[i]).async('string');
      const dom = new DOMParser().parseFromString(xml, 'application/xml');

      // 1) 表格单独转 Markdown，避免拆成散行
      const tables = [];
      const inTable = new Set();
      for (const tbl of dom.getElementsByTagName('a:tbl')) {
        const rows = [];
        for (const tr of tbl.getElementsByTagName('a:tr')) {
          const cells = [];
          for (const tc of tr.getElementsByTagName('a:tc')) {
            const txt = Array.from(tc.getElementsByTagName('a:t')).map((t) => t.textContent || '').join('').trim();
            cells.push(txt.replace(/\|/g, '\\|').replace(/\n/g, ' '));
          }
          if (cells.length) rows.push(cells);
        }
        for (const p of tbl.getElementsByTagName('a:p')) inTable.add(p);
        if (!rows.length) continue;
        const cols = Math.max(...rows.map((r) => r.length));
        const norm = rows.map((r) => { const c = r.slice(); while (c.length < cols) c.push(''); return c; });
        let md = '| ' + norm[0].join(' | ') + ' |\n| ' + norm[0].map(() => '---').join(' | ') + ' |\n';
        for (let k = 1; k < norm.length; k++) md += '| ' + norm[k].join(' | ') + ' |\n';
        tables.push(md);
      }

      // 2) 正文段落（排除表格内的段落）
      const lines = [];
      for (const p of dom.getElementsByTagName('a:p')) {
        if (inTable.has(p)) continue;
        let t = '';
        for (const n of p.getElementsByTagName('a:t')) t += n.textContent || '';
        t = t.trim();
        if (t && !isNoise(t)) lines.push(t);
      }

      let seg = `## 第 ${i + 1} 页\n`;
      const parts = [];
      if (lines.length) parts.push(lines.join('\n'));
      for (const md of tables) parts.push(md.trimEnd());
      seg += parts.length ? parts.join('\n\n') : '（本页无文字，可能是纯图片）';

      // 3) 演讲者备注（过滤纯数字占位）
      const nf = notesMap[i + 1];
      if (nf) {
        try {
          const nx = await zip.file(nf).async('string');
          const nd = new DOMParser().parseFromString(nx, 'application/xml');
          const nt = Array.from(nd.getElementsByTagName('a:t'))
            .map((t) => (t.textContent || '').trim())
            .filter((t) => t && !isNoise(t))
            .join(' ')
            .trim();
          if (nt) seg += `\n\n> 备注：${nt}`;
        } catch { }
      }
      out.push(seg);
    }
    const text = out.join('\n\n');
    return { text, meta: { kind: 'pptx', slides: slideFiles.length, ext: 'pptx' } };
  }
};

/* PDF 解析抽成公共函数，附件与知识库共用 */
async function readPdfBlob(file) {
  await CDN.load('pdfjs');
  const pdfjs = window.pdfjsLib;
  if (pdfjs.GlobalWorkerOptions) {
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  let out = '';
  const max = Math.min(doc.numPages, 80);
  for (let i = 1; i <= max; i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    out += tc.items.map((it) => it.str).join(' ') + '\n\n';
    if (out.length > 200000) { out += '…（已截断）'; break; }
  }
  const text = out.trim();
  if (!text) throw new Error('这个 PDF 没有可提取的文字（可能是扫描件，需要 OCR）');
  return text;
}

/* ===== 17-artifacts.js ===== */
/* ============ 17 产物持久化：IndexedDB 存字节，刷新后仍可下载 ============ */
/* 背景：会话消息存 localStorage，Blob 无法序列化，刷新后 art.blob 会变成空对象，
   点下载就什么都不发生。这里把产物的字节单独存进 IndexedDB，按 id 取回。 */
const ArtifactStore = {
  DB: 'aaim-artifacts',
  VER: 1,
  STORE: 'files',
  _db: null,

  open() {
    if (this._db) return Promise.resolve(this._db);
    if (typeof indexedDB === 'undefined') return Promise.reject(new Error('浏览器不支持 IndexedDB'));
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(this.DB, this.VER); }
      catch (e) { return rej(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(this.STORE)) {
          const os = db.createObjectStore(this.STORE, { keyPath: 'id' });
          os.createIndex('ts', 'ts');
        }
      };
      req.onsuccess = () => { this._db = req.result; res(this._db); };
      req.onerror = () => rej(req.error || new Error('IndexedDB 打开失败'));
      req.onblocked = () => rej(new Error('IndexedDB 被其它标签页占用'));
    });
  },

  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(this.STORE, mode);
      let out;
      try { out = fn(tx.objectStore(this.STORE)); } catch (e) { return rej(e); }
      tx.oncomplete = () => res(out && out.__req ? out.__req.result : out);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('事务中断'));
    });
  },

  /** 存一个产物（art: {id,name,mime,size,kind,blob}） */
  async put(art) {
    try {
      if (!art || !art.id) return false;
      const blob = art.blob;
      if (!(blob instanceof Blob)) return false;
      const buf = await blob.arrayBuffer();
      await this._tx('readwrite', (os) => os.put({
        id: art.id, name: art.name, mime: art.mime, size: art.size,
        kind: art.kind, ts: Date.now(), buf
      }));
      return true;
    } catch (e) {
      console.warn('[ArtifactStore] 保存失败', art && art.name, e);
      return false;
    }
  },

  /** 按 id 取回 Blob（找不到返回 null） */
  async get(id) {
    try {
      const db = await this.open();
      const rec = await new Promise((res, rej) => {
        const tx = db.transaction(this.STORE, 'readonly');
        const rq = tx.objectStore(this.STORE).get(id);
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
      if (!rec || !rec.buf) return null;
      return new Blob([rec.buf], { type: rec.mime || 'application/octet-stream' });
    } catch (e) {
      console.warn('[ArtifactStore] 读取失败', id, e);
      return null;
    }
  },

  async has(id) {
    try {
      const db = await this.open();
      const n = await new Promise((res, rej) => {
        const tx = db.transaction(this.STORE, 'readonly');
        const rq = tx.objectStore(this.STORE).count(id);
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
      return n > 0;
    } catch { return false; }
  },

  async del(id) { try { await this._tx('readwrite', (os) => os.delete(id)); } catch { } },
  async clear() { try { await this._tx('readwrite', (os) => os.clear()); } catch { } },

  async list() {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const tx = db.transaction(this.STORE, 'readonly');
        const rq = tx.objectStore(this.STORE).getAll();
        rq.onsuccess = () => res((rq.result || []).map((r) => ({ id: r.id, name: r.name, size: r.size, kind: r.kind, ts: r.ts })));
        rq.onerror = () => rej(rq.error);
      });
    } catch { return []; }
  },

  /** 清理：超过 maxAge 天的，或总量超过 maxCount 个的旧记录 */
  async prune({ maxAge = 14 * 864e5, maxCount = 80 } = {}) {
    try {
      const all = await this.list();
      if (!all.length) return 0;
      const now = Date.now();
      const old = all.filter((r) => now - (r.ts || 0) > maxAge);
      const sorted = all.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
      const over = sorted.slice(maxCount);
      const kill = new Set([...old, ...over].map((r) => r.id));
      for (const id of kill) await this.del(id);
      return kill.size;
    } catch { return 0; }
  }
};

/** 把产物解析成可用的 Blob：内存里有效就直接用，否则回 IndexedDB 取 */
async function resolveArtifactBlob(art) {
  if (!art) return null;
  if (art.blob instanceof Blob) return art.blob;
  if (!art.id) return null;
  const b = await ArtifactStore.get(art.id);
  if (b) art.blob = b;                 // 回填，下次直接用
  return b;
}

/** 下载产物（异步解析，兼容刷新后的历史记录） */
async function downloadArtifact(art) {
  if (!art) return toast('找不到这个文件', 'err');
  const t = (art.blob instanceof Blob) ? null : toast('正在从本地存储恢复文件…', '', 8000);
  let blob = null;
  try { blob = await resolveArtifactBlob(art); }
  finally { if (t) t.remove(); }
  if (!blob) {
    toast(`「${art.name}」的原始内容已不在本地（只保留了文件名）。请让 Agent 重新生成一次。`, 'err', 6500);
    return false;
  }
  downloadBlob(blob, art.name);
  return true;
}

/** 在新窗口打开 HTML 类产物 */
async function openArtifact(art) {
  if (!art) return;
  const t = (art.blob instanceof Blob) ? null : toast('正在恢复文件…', '', 8000);
  let blob = null;
  try { blob = await resolveArtifactBlob(art); }
  finally { if (t) t.remove(); }
  if (!blob) return toast(`「${art.name}」的内容已不在本地，请重新生成。`, 'err', 6000);
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank', 'noopener');
  if (!w) toast('浏览器拦截了新窗口，请允许弹窗后重试', 'err');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/** 判断某个产物现在能不能下载（用于 UI 置灰） */
function artifactReady(art) {
  return !!(art && (art.blob instanceof Blob));
}

/* ===== 18-org.js ===== */
/* ============ 18 企业式子 Agent：组织模型 / 通信总线 / 检查者 / 运行引擎 ============ */
/* 设计要点
   · 层级：大领导（1 个，可多个小领导）→ 小领导（可再挂小领导或执行者）→ 执行者
   · 检查者：独立于指挥链，数量 >= 1，评审标准写死在代码里，领导改不了也删不掉
   · 通信：所有 agent 共用一个消息总线，可随时互发；消息带附件（工具结果 / 上传内容）
   · 每个 agent 有独立上下文（自己的 messages），互相不污染
*/

const ORG_ROLES = {
  leader: { label: '大领导', icon: 'crown', canDelegate: true, level: 0 },
  subleader: { label: '小领导', icon: 'lead', canDelegate: true, level: 1 },
  worker: { label: '执行者', icon: 'worker', canDelegate: false, level: 2 },
  inspector: { label: '检查者', icon: 'shield', canDelegate: false, level: 0 }
};

/* ---------------- 组织数据模型 ---------------- */
const Org = {
  get data() {
    if (!State.org) State.org = this.defaults();
    return State.org;
  },
  defaults() {
    return {
      enabled: false,
      nodes: [
        this.makeNode({ id: 'leader', name: '大领导', role: 'leader', parentId: null, prompt: '你负责接收目标、拆解任务、分派给下级，并对最终交付负责。要明确验收标准。' }),
        this.makeNode({ id: 'sub1', name: '小领导', role: 'subleader', parentId: 'leader', prompt: '你负责把上级分派的任务再拆成可执行的子任务，交给执行者，并把结果整合后上报。' }),
        this.makeNode({ id: 'w1', name: '执行者 A', role: 'worker', parentId: 'sub1', prompt: '你是执行者，专注把交给你的具体任务做完，给出可直接使用的结果。' }),
        this.makeNode({ id: 'w2', name: '执行者 B', role: 'worker', parentId: 'sub1', prompt: '你是执行者，专注把交给你的具体任务做完，给出可直接使用的结果。' }),
        this.makeNode({ id: 'insp1', name: '检查者', role: 'inspector', parentId: null, prompt: '' })
      ],
      seq: 5,
      maxDepth: 4,
      maxRework: 2,        // 被检查者打回后最多重做几次
      maxStepsPerAgent: 4  // 单个 agent 最多几轮工具调用
    };
  },
  makeNode(o = {}) {
    const role = o.role || 'worker';
    return {
      id: o.id || uid('n'),
      name: o.name || (ORG_ROLES[role] ? ORG_ROLES[role].label : '成员'),
      role,
      parentId: o.parentId === undefined ? null : o.parentId,
      prompt: o.prompt != null ? o.prompt : '',
      model: o.model || '',            // 留空用全局设置
      expanded: o.expanded !== false,
      status: 'idle',                  // idle | running | done | error | blocked
      lastActive: 0
    };
  },
  save() { Store.set('org', this.data); },

  all() { return this.data.nodes; },
  get(id) { return this.data.nodes.find((n) => n.id === id) || null; },
  leaders() { return this.data.nodes.filter((n) => n.role === 'leader' && !n.parentId); },
  rootLeader() { return this.leaders()[0] || null; },
  inspectors() { return this.data.nodes.filter((n) => n.role === 'inspector'); },
  childrenOf(id) { return this.data.nodes.filter((n) => n.parentId === id); },
  /** 指挥链（不含检查者） */
  chain() { return this.data.nodes.filter((n) => n.role !== 'inspector'); },

  /** 深度（领导 = 0） */
  depth(id) {
    let d = 0, cur = this.get(id), guard = 0;
    while (cur && cur.parentId && guard++ < 20) { d++; cur = this.get(cur.parentId); }
    return d;
  },
  path(id) {
    const out = []; let cur = this.get(id), guard = 0;
    while (cur && guard++ < 20) { out.unshift(cur); cur = cur.parentId ? this.get(cur.parentId) : null; }
    return out;
  },

  add(opts) {
    const parent = opts.parentId ? this.get(opts.parentId) : null;
    if (opts.parentId && !parent) throw new Error('找不到上级');
    if (parent && !ORG_ROLES[parent.role].canDelegate) throw new Error(`${ORG_ROLES[parent.role].label}不能有下属`);
    if (parent && parent.role === 'inspector') throw new Error('检查者不参与指挥链');
    const d = parent ? this.depth(parent.id) + 1 : 0;
    if (d >= this.data.maxDepth) throw new Error(`层级超过上限（${this.data.maxDepth} 层）`);
    const n = this.makeNode(Object.assign({}, opts, { parentId: parent ? parent.id : null }));
    this.data.nodes.push(n);
    this.save();
    return n;
  },
  update(id, patch) {
    const n = this.get(id);
    if (!n) return null;
    // 检查者的名字可以改，但评审标准在代码里，这里改不了
    Object.assign(n, patch);
    this.save();
    return n;
  },
  remove(id) {
    const n = this.get(id);
    if (!n) return false;
    if (n.role === 'leader' && !n.parentId) throw new Error('大领导不能被删除');
    if (n.role === 'inspector' && this.inspectors().length <= 1) throw new Error('至少要保留一名检查者');
    // 连同子树一起删
    const kill = new Set([id]);
    let grew = true;
    while (grew) {
      grew = false;
      for (const x of this.data.nodes) {
        if (x.parentId && kill.has(x.parentId) && !kill.has(x.id)) { kill.add(x.id); grew = true; }
      }
    }
    this.data.nodes = this.data.nodes.filter((x) => !kill.has(x.id));
    OrgBus.purgeAgents([...kill]);
    this.save();
    return true;
  },
  /** 依赖检查：能否开始运行 */
  validate() {
    const errs = [];
    if (!this.rootLeader()) errs.push('缺少大领导');
    if (!this.inspectors().length) errs.push('必须至少有一名检查者');
    for (const n of this.chain()) {
      if (ORG_ROLES[n.role].canDelegate && n.id !== 'leader') {
        // 允许领导没有下属（会被当成执行者用），只提示
      }
    }
    return { ok: errs.length === 0, errs };
  },
  resetRun() {
    for (const n of this.data.nodes) { n.status = 'idle'; n.lastActive = 0; }
    this.save();
  }
};

/* ---------------- 通信总线：Agent 之间实时互发 ---------------- */
const OrgBus = {
  list() { return (State.orgBus || []).slice(); },
  save() { Store.set('orgBus', (State.orgBus || []).slice(-400)); },

  /**
   * 发消息
   * @param {string} from 发送者 id（'user' 表示人）
   * @param {string|'all'} to 接收者 id
   * @param {object} opt { subject, body, attachments:[{name, kind, text, chars}], kind }
   */
  send(from, to, opt = {}) {
    if (!State.orgBus) State.orgBus = [];
    const msg = {
      id: uid('m'),
      from, to,
      subject: String(opt.subject || '').slice(0, 200),
      body: String(opt.body || ''),
      attachments: (opt.attachments || []).map((a) => ({
        name: a.name || '附件', kind: a.kind || 'text',
        chars: a.chars != null ? a.chars : (a.text ? a.text.length : 0),
        text: String(a.text || '').slice(0, 20000)
      })),
      kind: opt.kind || 'message',      // message | dispatch | report | review
      ts: Date.now(),
      readBy: []
    };
    State.orgBus.push(msg);
    if (State.orgBus.length > 400) State.orgBus = State.orgBus.slice(-400);
    this.save();
    this.emit(msg);
    return msg;
  },

  /** 取某个 agent 的收件箱 */
  inboxOf(id, { unreadOnly = false, limit = 20 } = {}) {
    return this.list()
      .filter((m) => (m.to === id || m.to === 'all') && m.from !== id)
      .filter((m) => !unreadOnly || !m.readBy.includes(id))
      .slice(-limit);
  },
  markRead(id, ids) {
    const set = new Set(ids || this.list().map((m) => m.id));
    for (const m of this.list()) if (set.has(m.id) && !m.readBy.includes(id)) m.readBy.push(id);
    this.save();
  },
  unreadCount(id) { return this.inboxOf(id, { unreadOnly: true, limit: 999 }).length; },

  /** 把收件箱渲染成给模型看的文本（把附件正文也带上） */
  renderInbox(id, limit = 8) {
    const msgs = this.inboxOf(id, { unreadOnly: true, limit });
    if (!msgs.length) return '';
    const nameOf = (aid) => (aid === 'user' ? '用户' : (Org.get(aid) ? Org.get(aid).name : aid));
    return msgs.map((m) => {
      let line = `【来自 ${nameOf(m.from)}｜${m.kind}】${m.subject ? m.subject + '：' : ''}${m.body}`;
      for (const a of m.attachments) {
        line += `\n  ▸ 附件《${a.name}》：${truncate(a.text, 1500)}`;
      }
      return line;
    }).join('\n\n');
  },

  purgeAgents(ids) {
    const set = new Set(ids);
    State.orgBus = this.list().filter((m) => !set.has(m.from) && !set.has(m.to));
    this.save();
  },
  clear() { State.orgBus = []; this.save(); this.emit(null); },

  _subs: new Set(),
  subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); },
  emit(msg) { for (const fn of this._subs) { try { fn(msg); } catch { } } }
};

/* ---------------- 检查者：评审标准写死在代码里，领导改不了 ---------------- */
/* 这是「完全公正」的实现方式：
   · 评审用的 system prompt 是下面的常量，不读节点的 prompt 字段
   · 检查者不能被删除（至少保留 1 名）
   · 检查者不接收领导的分派指令，只接收待审内容
   · 评审结论带打分与必须修改项，打回必须给出可执行理由
*/
const Inspector = {
  CRITERIA: [
    '1. 是否真正回答了被分派的任务，而不是答非所问或泛泛而谈',
    '2. 关键事实是否有依据（引用、数据、工具结果），有没有编造',
    '3. 交付物是否完整可用（该有的部分是否都在，格式是否可用）',
    '4. 有没有明显的逻辑错误、自相矛盾、单位/数字错误',
    '5. 是否遵守了任务里写明的约束（范围、口径、格式要求）',
    '6. 有没有把没做完的事说成做完了'
  ],

  /** 硬编码的评审指令：任何界面操作都改不到这里 */
  SYSTEM_PROMPT() {
    return [
      '你是一名独立的质量检查员，与被检查的下属没有任何隶属关系，也不受其上级影响。',
      '你的唯一职责是判断交付物是否合格，并且必须保持公正：',
      '· 不因为任务看起来简单就放松标准，也不因为交付物很长就给高分',
      '· 只依据任务要求与交付内容本身判断，不看是谁做的',
      '· 交付物有问题时必须明确指出，并给出可以照着改的具体意见',
      '',
      '评审标准：',
      this.CRITERIA.join('\n'),
      '',
      '严格按下面的 JSON 输出，不要输出任何其它内容：',
      '{"verdict":"pass"|"reject","score":0-100,"reasons":["..."],"mustFix":["..."]}',
      'score < 70 或存在实质性缺陷时必须 reject，并在 mustFix 里写清要改什么。'
    ].join('\n');
  },

  /** 同一次评审用哪个节点（多个检查者时轮询，避免总用同一个） */
  pick(excludeIds = []) {
    const all = Org.inspectors().filter((n) => !excludeIds.includes(n.id));
    const pool = all.length ? all : Org.inspectors();
    if (!pool.length) return null;
    this._rr = ((this._rr || 0) + 1) % pool.length;
    return pool[this._rr];
  },

  async review({ task, output, context, inspectorId }) {
    const who = inspectorId ? Org.get(inspectorId) : this.pick();
    if (!who) return { verdict: 'pass', score: 100, reasons: ['未配置检查者，跳过审核'], mustFix: [], skipped: true };

    const payload = [
      '【被分派的任务】',
      task || '(未填写)',
      '',
      context ? '【任务背景】\n' + context + '\n' : '',
      '【待审交付内容】',
      truncate(String(output || ''), 12000),
      '',
      '请给出评审结论（只输出 JSON）。'
    ].filter(Boolean).join('\n');

    let raw = '';
    try {
      const res = await LLM.chat({
        messages: [
          { role: 'system', content: this.SYSTEM_PROMPT() },
          { role: 'user', content: payload }
        ],
        tools: [],                     // 检查者不调用任何工具，避免被工具结果带偏
        signal: (typeof OrgRuntime !== 'undefined' && OrgRuntime.signal) ? OrgRuntime.signal() : undefined
      });
      raw = res.text || '';
      State.usage.inTok += res.usage.in || 0;
      State.usage.outTok += res.usage.out || 0;
      State.usage.calls++;
    } catch (e) {
      return { verdict: 'error', score: 0, reasons: ['检查者调用失败：' + e.message], mustFix: ['请检查模型配置后重试'], inspectorId: who.id };
    }

    const parsed = this.parse(raw);
    parsed.inspectorId = who.id;
    parsed.raw = truncate(raw, 600);
    return parsed;
  },

  /** 容错解析：模型可能带 ```json 包裹或多说几句 */
  parse(raw) {
    const text = String(raw || '');
    let json = null;
    const fence = /```(?:json)?\s*([\s\S]*?)```/i.exec(text);
    const candidates = [fence && fence[1], text].filter(Boolean);
    for (const c of candidates) {
      const m = /\{[\s\S]*\}/.exec(c);
      if (!m) continue;
      try { json = JSON.parse(m[0]); break; } catch { }
    }
    if (!json || typeof json !== 'object') {
      // 解析不出来：按不通过处理，但标出原因，避免"假通过"
      return { verdict: 'reject', score: 0, reasons: ['检查者返回的不是可解析的 JSON'], mustFix: ['请检查者重新评审'], unparsed: true };
    }
    const verdict = String(json.verdict || '').toLowerCase() === 'pass' ? 'pass' : 'reject';
    const score = Math.max(0, Math.min(100, Number(json.score) || 0));
    const reasons = Array.isArray(json.reasons) ? json.reasons.map(String) : (json.reasons ? [String(json.reasons)] : []);
    const mustFix = Array.isArray(json.mustFix) ? json.mustFix.map(String) : [];
    // 分数过低时即使模型说 pass 也按 reject 处理（防止放水）
    const finalVerdict = (verdict === 'pass' && score >= 70) ? 'pass' : 'reject';
    return { verdict: finalVerdict, score, reasons, mustFix, downgraded: verdict === 'pass' && finalVerdict === 'reject' };
  }
};

/* ---------------- 运行引擎 ---------------- */
const OrgRuntime = {
  running: false,
  abortFlag: false,
  trace: [],            // 本次运行的完整轨迹（UI 实时展示）
  hooks: {},            // UI 注入
  _budget: {},
  _ac: null,            // 本次运行专用的 AbortController（并行时必须能一起掐断）
  _busy: new Map(),     // agentId -> Promise，保证同一个 agent 不会被并发重入
  _parallelSeq: 0,      // 并行组编号

  /** 子 Agent 可用的工具白名单（排除需要人工确认的敏感工具） */
  TOOL_WHITELIST: ['web_search', 'web_fetch', 'kb_search', 'render_chart', 'render_mermaid',
    'generate_docx', 'generate_xlsx', 'generate_pptx', 'generate_pdf', 'make_html_app',
    'list_artifacts', 'recall', 'delegate_task'],

  say(ev) {
    ev.ts = Date.now();
    this.trace.push(ev);
    if (this.trace.length > 600) this.trace.splice(0, 200);
    const fn = this.hooks.onEvent;
    if (fn) { try { fn(ev); } catch { } }
  },

  reset() {
    this.abortFlag = false;
    this.trace = [];
    this._budget = {};
    this._busy = new Map();
    this._parallelSeq = 0;
    try { if (this._ac) this._ac.abort(); } catch { }
    this._ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    Org.resetRun();
  },
  /** 所有 LLM 调用统一用这个 signal，停止时能真正掐断 */
  signal() { return this._ac ? this._ac.signal : undefined; },

  /** 顶部入口：把目标交给大领导，直到产出最终答复 */
  async run(goal, opts = {}) {
    const v = Org.validate();
    if (!v.ok) throw new Error('组织配置不完整：' + v.errs.join('；'));
    if (this.running) throw new Error('已有任务在运行');
    const leader = Org.rootLeader();
    if (!leader) throw new Error('缺少大领导');

    this.running = true;
    this.reset();
    const attachments = opts.attachments || [];
    this.say({ type: 'start', nodeId: leader.id, text: '接收目标：' + truncate(goal, 120), attachments: attachments.map((a) => a.name) });

    // 用户 → 大领导
    OrgBus.send('user', leader.id, { subject: '新任务', body: goal, attachments, kind: 'dispatch' });

    try {
      const res = await this.runNode(leader.id, goal, {
        attachments, depth: 0, top: true, acceptance: opts.acceptance || ''
      });
      this.say({ type: 'finish', nodeId: leader.id, text: '任务结束' });
      return res;
    } finally {
      this.running = false;
      Org.save();
      if (this.hooks.onEnd) this.hooks.onEnd();
    }
  },

  stop() {
    this.abortFlag = true;
    try { if (this._ac) this._ac.abort(); } catch { }
    for (const n of Org.all()) if (n.status === 'running') n.status = 'idle';
  },

  /** 节点的角色 prompt（检查者走硬编码，不用这里的 prompt） */
  buildSystemPrompt(node, ctx = {}) {
    const boss = node.parentId ? Org.get(node.parentId) : null;
    const subs = Org.childrenOf(node.id);
    const subText = subs.length
      ? subs.map((s) => `- ${s.id}｜${s.name}（${ORG_ROLES[s.role].label}）`).join('\n')
      : '（你没有直属下级，需要自己动手完成）';

    const lines = [
      `你是「${node.name}」，一家 AI 公司里的${ORG_ROLES[node.role].label}。`,
      boss ? `你的上级是「${boss.name}」。` : '你是最高负责人，直接对用户负责。',
      '',
      '【你的团队（可以直接分派的对象）】',
      subText,
      '',
      '【工作方式】',
      '· 收到任务先判断：能自己做就直接做；需要拆解就用 dispatch_task 分派给下级（会立刻执行并返回结果）。',
      '· 分派时把「要做什么、验收标准、边界」写清楚，下级看不到你和其他人的对话。',
      '· 你可以用 send_message 给公司里任何人（含平级、下级、上级）发消息，它不会阻塞。',
      '· 有不明白或缺少关键信息时，用 ask_user 直接问用户。',
      '· 最后必须给出可以直接交给上级的成品，不要写"建议你去查"这类空话。',
      '',
      '【硬性要求】',
      '· 你的产出会被独立检查者审核，不合格会被打回重做。请一次性把事实、数据、交付物写清楚。',
      '· 不确定的事要标明"未确认"，不要把猜测写成事实。',
      '· 用中文，结构清晰。'
    ];
    if (node.prompt && node.prompt.trim()) {
      lines.push('', '【上级给你的角色说明】', node.prompt.trim());
    }
    if (ctx.acceptance) lines.push('', '【本次任务的验收标准】', ctx.acceptance);
    return lines.join('\n');
  },

  /** 为某个节点构造工具集 */
  nodeTools(node) {
    const subs = Org.childrenOf(node.id);
    const tools = [];

    if (subs.length) {
      tools.push({
        type: 'function',
        function: {
          name: 'dispatch_task',
          description: '把子任务分派给某个直属下级，会立即执行并返回它的交付结果（已通过检查者审核）。',
          parameters: {
            type: 'object',
            properties: {
              agent_id: { type: 'string', description: '下级 id，可选值：' + subs.map((s) => s.id).join(' / ') },
              task: { type: 'string', description: '要它做的具体事情，自包含（下级看不到你的上下文）' },
              acceptance: { type: 'string', description: '验收标准：什么样算做完' }
            },
            required: ['agent_id', 'task']
          }
        }
      });

      // 并行分派：多个互不依赖的子任务同时开跑
      if (subs.length >= 2) {
        tools.push({
          type: 'function',
          function: {
            name: 'dispatch_parallel',
            description: '把多个「互不依赖」的子任务同时分派给多个直属下级，并行执行，等全部完成一起返回。'
              + '适合能同时做的活（例如同时调研三家公司、同时产出表格与文档）。'
              + '有先后依赖时必须用 dispatch_task 串行做，不要用这个。',
            parameters: {
              type: 'object',
              properties: {
                tasks: {
                  type: 'array',
                  description: '要并行分派的任务列表（建议 2–4 个）',
                  items: {
                    type: 'object',
                    properties: {
                      agent_id: { type: 'string', description: '下级 id，可选值：' + subs.map((s2) => s2.id).join(' / ') },
                      task: { type: 'string', description: '要它做的具体事情，自包含' },
                      acceptance: { type: 'string', description: '验收标准' }
                    },
                    required: ['agent_id', 'task']
                  }
                }
              },
              required: ['tasks']
            }
          }
        });
      }
    }

    tools.push({
      type: 'function',
      function: {
        name: 'send_message',
        description: '给公司里任意成员发一条消息（不阻塞，对方下次工作时能看到）。可用于同步进展、请求协助、告知结论。',
        parameters: {
          type: 'object',
          properties: {
            to: { type: 'string', description: '收件人 id，或填 all 广播' },
            subject: { type: 'string' },
            body: { type: 'string' }
          },
          required: ['to', 'body']
        }
      }
    });

    tools.push({
      type: 'function',
      function: {
        name: 'ask_user',
        description: '当缺少关键信息、或需要用户在多个方案里做选择时，直接向用户提问。',
        parameters: { type: 'object', properties: { question: { type: 'string' } }, required: ['question'] }
      }
    });

    // 基础能力：只给白名单里的
    const base = Tools.schemas().filter((t) => this.TOOL_WHITELIST.includes(t.function.name));
    return tools.concat(base);
  },

  /** 执行一次节点：ReAct + 审核 + 打回重做 */
  async runNode(nodeId, task, ctx = {}) {
    const node = Org.get(nodeId);
    if (!node) throw new Error('节点不存在：' + nodeId);
    if (node.role === 'inspector') throw new Error('检查者不执行任务');
    if (this.abortFlag) return { text: '（已停止）', aborted: true };

    const cfg = Org.data;
    let attempt = 0;
    let lastOutput = '';
    let lastReview = null;
    const history = [];   // 打回意见累积给下一次

    while (attempt <= cfg.maxRework) {
      if (this.abortFlag) break;
      attempt++;
      node.status = 'running'; node.lastActive = Date.now(); Org.save();
      this.say({ type: 'node-start', nodeId, attempt, text: `${node.name} 开始工作${attempt > 1 ? `（第 ${attempt} 次，上一轮被打回）` : ''}` });

      let out;
      try {
        out = await this.runAgentLoop(node, task, Object.assign({}, ctx, { rework: history, attempt }));
      } catch (e) {
        node.status = 'error'; Org.save();
        this.say({ type: 'node-error', nodeId, text: `${node.name} 出错：${e.message}` });
        throw e;
      }
      lastOutput = out.text || '';

      // ★ 审核：检查者独立评审
      const rev = await Inspector.review({
        task,
        output: lastOutput,
        context: ctx.acceptance ? '验收标准：' + ctx.acceptance : ''
      });
      lastReview = rev;
      this.say({
        type: 'review', nodeId, inspectorId: rev.inspectorId,
        verdict: rev.verdict, score: rev.score,
        text: `检查者评分 ${rev.score} → ${rev.verdict === 'pass' ? '通过' : '打回'}`,
        reasons: rev.reasons, mustFix: rev.mustFix
      });

      if (rev.verdict === 'pass' || rev.skipped) break;

      if (attempt > cfg.maxRework) {
        // 重做次数用尽：仍然上报，但标记未通过，让上级和用户看到
        node.status = 'blocked'; Org.save();
        this.say({ type: 'node-blocked', nodeId, text: `${node.name} 重做 ${cfg.maxRework} 次仍未通过检查，带着问题上报` });
        break;
      }
      // 把打回意见作为下一轮的输入
      history.push({ attempt, score: rev.score, mustFix: rev.mustFix, reasons: rev.reasons });
      this.say({ type: 'node-rework', nodeId, text: `${node.name} 被打回，问题：` + truncate((rev.mustFix || []).join('；') || (rev.reasons || []).join('；'), 160) });
    }

    node.status = (lastReview && lastReview.verdict === 'pass') ? 'done' : (node.status === 'blocked' ? 'blocked' : 'done');
    node.lastActive = Date.now(); Org.save();

    return { text: lastOutput, review: lastReview, attempts: attempt, node: node.name };
  },

  /** 单个节点的 ReAct 循环 */
  async runAgentLoop(node, task, ctx = {}) {
    const tools = this.nodeTools(node);
    const hasSubs = Org.childrenOf(node.id).length > 0;

    // 收件箱（未读）
    const inbox = OrgBus.renderInbox(node.id);
    if (inbox) OrgBus.markRead(node.id, OrgBus.inboxOf(node.id, { unreadOnly: true, limit: 99 }).map((m) => m.id));

    const taskText = [
      '【当前任务】',
      task,
      '',
      ctx.acceptance ? '【验收标准】\n' + ctx.acceptance + '\n' : '',
      ctx.attachments && ctx.attachments.length
        ? '【随任务附上的材料】\n' + ctx.attachments.map((a) => `《${a.name}》：\n${truncate(a.text, 4000)}`).join('\n\n')
        : '',
      inbox ? '【你的新消息】\n' + inbox : '',
      (ctx.rework && ctx.rework.length)
        ? '【上一版被打回，必须修复】\n' + ctx.rework.map((r) => `- 第 ${r.attempt} 版（${r.score} 分）：${(r.mustFix && r.mustFix.length ? r.mustFix : r.reasons || []).join('；')}`).join('\n')
        : ''
    ].filter(Boolean).join('\n');

    const messages = [
      { role: 'system', content: this.buildSystemPrompt(node, ctx) },
      { role: 'user', content: taskText }
    ];

    const maxSteps = Number(Org.data.maxStepsPerAgent) || 4;
    let text = '';

    for (let step = 0; step < maxSteps; step++) {
      if (this.abortFlag) break;
      const res = await LLM.chat({
        messages,
        tools,
        signal: this.signal() || (State.abort ? State.abort.signal : undefined),
        onDelta: (d, all) => { this.say({ type: 'delta', nodeId: node.id, text: all.slice(-80) }); }
      });
      State.usage.inTok += res.usage.in || 0;
      State.usage.outTok += res.usage.out || 0;
      State.usage.calls++;
      text = res.text || text;

      if (!res.toolCalls.length) break;

      messages.push({
        role: 'assistant', content: res.text || '',
        tool_calls: res.toolCalls.map((c) => ({ id: c.id, name: c.name, arguments: c.arguments }))
      });

      for (const call of res.toolCalls) {
        if (this.abortFlag) break;
        let outText = '';
        try {
          outText = await this.execNodeTool(node, call, ctx);
        } catch (e) {
          outText = '工具执行失败：' + e.message;
        }
        messages.push({ role: 'tool', tool_call_id: call.id, name: call.name, content: String(outText).slice(0, 12000) });
      }
    }
    return { text };
  },

  /** 校验某个 id 是不是自己的直属下级，返回节点 */
  checkSubordinate(boss, agentId) {
    const id = String(agentId || '').trim();
    const sub = Org.get(id);
    const opts = Org.childrenOf(boss.id).map((x) => `${x.id}（${x.name}）`).join(' / ') || '（你没有下级）';
    if (!sub) throw new Error(`找不到这个下级：${id || '(空)'}；可选：${opts}`);
    if (sub.parentId !== boss.id) throw new Error(`${sub.name} 不是你的直属下级；可选：${opts}`);
    if (sub.role === 'inspector') throw new Error('检查者不接任务');
    if (Org.depth(sub.id) >= Org.data.maxDepth) throw new Error('层级超限');
    return sub;
  },

  /**
   * 派一个任务给一个下级，等它做完并回传。
   * 同一个 agent 用 Promise 链串行化：如果它正在忙，后来的调用排队等待，
   * 这样并行批次里即使误派同一个对象也不会把它的上下文搅乱。
   */
  async dispatchOne(boss, sub, { task, acceptance, ctx = {}, group = null }) {
    const prev = this._busy.get(sub.id) || Promise.resolve();
    let release;
    const gate = new Promise((r) => { release = r; });
    const mine = prev.then(() => gate);
    this._busy.set(sub.id, mine);

    await prev;   // 排队：上一个任务做完才轮到这次
    try {
      if (this.abortFlag) return { node: sub.name, text: '（已停止）', review: null, aborted: true };

      this.say({
        type: 'dispatch', nodeId: boss.id, to: sub.id, group,
        text: `${boss.name} → ${sub.name}：${truncate(task, 100)}`
      });
      OrgBus.send(boss.id, sub.id, {
        subject: group ? '并行任务分派' : '任务分派', body: task, kind: 'dispatch'
      });

      const subRes = await this.runNode(sub.id, task, {
        attachments: ctx.attachments || [],
        depth: (ctx.depth || 0) + 1,
        acceptance,
        top: false
      });

      OrgBus.send(sub.id, boss.id, {
        subject: '任务结果', body: truncate(subRes.text, 8000), kind: 'report'
      });
      this.say({
        type: 'report', nodeId: sub.id, to: boss.id, group,
        text: `${sub.name} 交付给 ${boss.name}（` +
          (subRes.review ? `${subRes.review.score} 分 ${subRes.review.verdict === 'pass' ? '通过' : '未通过'}` : '未审核') + '）'
      });

      const rv = subRes.review;
      const text = [
        `下级「${sub.name}」的交付：`,
        subRes.text || '(空)',
        '',
        rv ? `检查者评分：${rv.score}（${rv.verdict === 'pass' ? '通过' : '未通过'}）` : '',
        rv && rv.mustFix && rv.mustFix.length ? '待改进：' + rv.mustFix.join('；') : ''
      ].filter(Boolean).join('\n');

      return { node: sub.name, text, review: rv, attempts: subRes.attempts };
    } finally {
      release();
      // 清理已完成的锁，避免 Map 无限增长
      if (this._busy.get(sub.id) === mine) this._busy.delete(sub.id);
    }
  },

  /** 节点工具的实际执行 */
  async execNodeTool(node, call, ctx) {
    const name = call.name;
    const args = call.arguments || {};

    if (name === 'dispatch_task') {
      const sub = this.checkSubordinate(node, args.agent_id);
      const r = await this.dispatchOne(node, sub, {
        task: String(args.task || ''),
        acceptance: String(args.acceptance || ''),
        ctx,
        group: null
      });
      return r.text;
    }

    if (name === 'dispatch_parallel') {
      const list = Array.isArray(args.tasks) ? args.tasks : [];
      if (!list.length) throw new Error('tasks 不能为空');
      if (list.length > 5) throw new Error('一次最多并行 5 个任务，避免请求过多');

      // 校验：都是直属下级；同一批里同一 agent 只能出现一次（否则会产生歧义）
      const seen = new Set();
      const items = list.map((t, i) => {
        const sub = this.checkSubordinate(node, t && t.agent_id);
        if (seen.has(sub.id)) throw new Error(`「${sub.name}」在同一批里出现了多次；如果要给它两个任务，请合并成一个，或分批派`);
        seen.add(sub.id);
        return { sub, task: String((t && t.task) || ''), acceptance: String((t && t.acceptance) || ''), idx: i };
      });

      const gid = 'pg' + (++this._parallelSeq);
      this.say({
        type: 'parallel-start', nodeId: node.id, group: gid,
        text: `${node.name} 同时派出 ${items.length} 个任务：` + items.map((it) => it.sub.name).join('、')
      });

      const results = await Promise.all(items.map((it) => this.dispatchOne(node, it.sub, {
        task: it.task, acceptance: it.acceptance, ctx, group: gid
      })));

      this.say({
        type: 'parallel-end', nodeId: node.id, group: gid,
        text: `${items.length} 个并行任务全部返回（通过 ${results.filter((r) => r.review && r.review.verdict === 'pass').length} 个）`
      });

      return [
        `以下是 ${results.length} 个并行任务的结果，请综合它们再给出答复：`,
        '',
        ...results.map((r, i) => `### ${i + 1}. ${r.node}\n${r.text || '(空)'}\n` +
          (r.review ? `检查者：${r.review.score} 分（${r.review.verdict === 'pass' ? '通过' : '未通过'}）` +
            (r.review.mustFix && r.review.mustFix.length ? '；待改进：' + r.review.mustFix.join('；') : '') : '未审核'))
      ].join('\n');
    }

    if (name === 'send_message') {
      const to = String(args.to || 'all');
      if (to !== 'all' && !Org.get(to)) throw new Error('找不到收件人：' + to);
      OrgBus.send(node.id, to, { subject: String(args.subject || ''), body: String(args.body || ''), kind: 'message' });
      this.say({ type: 'message', nodeId: node.id, to, text: `${node.name} → ${to === 'all' ? '全员' : Org.get(to).name}：${truncate(args.body, 80)}` });
      return '已发送。';
    }

    if (name === 'ask_user') {
      this.say({ type: 'ask', nodeId: node.id, text: `${node.name} 询问用户：${truncate(args.question, 150)}` });
      if (this.hooks.onAsk) {
        try {
          const ans = await this.hooks.onAsk({ nodeId: node.id, question: String(args.question || '') });
          if (ans) {
            OrgBus.send('user', node.id, { subject: '用户的回答', body: ans, kind: 'message' });
            return '用户回答：' + ans;
          }
        } catch { }
      }
      return '用户暂时没有回答，请按最合理的假设继续，并标注这是假设。';
    }

    // 其它基础工具
    const out = await Tools.exec(name, args, { orgNode: node.id });
    if (out && out.display) {
      this.say({ type: 'tool', nodeId: node.id, name, display: out.display, text: `${node.name} 调用了 ${name}` });
    }
    return Tools.toToolText(out, 6000);
  }
};
